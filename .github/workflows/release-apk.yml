name: Build and Publish AquaTwin AI APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.75)'
        required: false
        default: 'v1.75'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and sync Capacitor
        working-directory: mobile-app
        run: |
          set -e
          mkdir -p www
          if [ -f index.html ]; then cp -f index.html www/index.html; fi
          if [ -f ml_data.js ]; then cp -f ml_data.js www/ml_data.js; fi
          if [ ! -f www/index.html ]; then
            echo "<h1>AquaTwin AI</h1>" > www/index.html
          fi

          cat <<'EOF' > capacitor.config.json
          {
            "appId": "com.aquatwin.ai",
            "appName": "AquaTwin AI",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          if [ ! -f package.json ]; then
            cat <<'EOF' > package.json
          {
            "name": "aquatwin-ai-mobile",
            "version": "1.75.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            }
          }
          EOF
          fi

          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps

          if [ ! -f android/app/build.gradle ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          set -e
          printf "sdk.dir=%s\n" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp -f app/build/outputs/apk/debug/app-debug.apk ../../AquaTwin-AI.apk

      - name: Publish or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: AquaTwin AI ${{ inputs.tag_name || github.ref_name }}
          files: AquaTwin-AI.apk
          make_latest: true