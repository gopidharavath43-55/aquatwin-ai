name: Build and Publish AquaTwin AI APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.75)'
        required: false
        default: 'v1.75'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Verify Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_DIR=$SDK_DIR"
          ls -la "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies & sync Capacitor
        working-directory: mobile-app
        run: |
          pwd
          ls -la
          node -v
          npm -v
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then
            cp index.html www/index.html
          fi
          if [ ! -f package.json ]; then
            npm init -y
            npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          elif [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npx cap --version
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          pwd
          ls -la
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../AquaTwin-AI.apk

      - name: Publish or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AquaTwin AI ${{ env.RELEASE_TAG }}
          files: AquaTwin-AI.apk
          make_latest: true