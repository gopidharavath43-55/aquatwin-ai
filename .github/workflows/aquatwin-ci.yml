name: AquaTwin AI — 3Y Model & Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 21 * * 6'   # Every Sunday 03:00 AM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-models-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify SHA-256 Integrity Manifest
        run: python ml/verify_integrity.py

      - name: Run Full 3Y Model & Security Audit
        run: python ml/run_final_audit.py
