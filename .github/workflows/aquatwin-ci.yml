name: AquaTwin AI — 3Y Model & Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 21 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-models-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate SHA-256 Manifest & Run 3Y Model/Security Audit
        run: |
          if [ -f ml/generate_integrity_manifest.py ]; then
            python ml/generate_integrity_manifest.py
          fi
          python ml/run_final_audit.py
