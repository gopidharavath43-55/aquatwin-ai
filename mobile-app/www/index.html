<script>
(function() {
  function attachHook() {
    if (window.L && L.Map && !window.__atHookAttached) {
      window.__atHookAttached = true;
      L.Map.addInitHook(function() {
        window.__atMap = this;
      });
    }
  }
  attachHook();
  document.addEventListener('DOMContentLoaded', attachHook);
})();
</script>

<!-- POLISH_V2_START -->
<script id="polish-v2-sat">
(function(){
  function patchLeafletSat(){
    if (!window.L || !L.TileLayer || L.TileLayer._satLabelPatched) return;
    L.TileLayer._satLabelPatched = true;
    var origAdd = L.TileLayer.prototype.onAdd;
    var origRem = L.TileLayer.prototype.onRemove;
    L.TileLayer.prototype.onAdd = function(map){
      var res = origAdd.call(this, map);
      if (this._url && /World_Imagery|satellite|aerial|imagery/i.test(this._url)) {
        if (!this._satLabels) {
          this._satLabels = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
            { maxZoom: 18, pane: 'overlayPane', zIndex: 650, opacity: 1 }
          );
        }
        this._satLabels.addTo(map);
      }
      return res;
    };
    L.TileLayer.prototype.onRemove = function(map){
      if (this._satLabels && map.hasLayer(this._satLabels)) map.removeLayer(this._satLabels);
      return origRem.call(this, map);
    };
  }
  patchLeafletSat();
  document.addEventListener('DOMContentLoaded', patchLeafletSat);
})();
</script>

<body>
  <header>
    <h1>AquaTwin AI</h1>
    <span class="pill-live">Offline Ready • 33 Districts</span>
  </header>

  <main>
    <!-- TAB 1: DISTRICTS -->
    <section id="view-list" class="view active">
      <div class="stats">
        <div class="stat-card"><span>Avg AI WQI</span><h2 id="avgWqi" style="color:var(--blue)">-</h2></div>
        <div class="stat-card"><span>Normal</span><h2 id="normalCount" style="color:var(--green)">-</h2></div>
        <div class="stat-card"><span>High Turbidity</span><h2 id="highCount" style="color:var(--red)">-</h2></div>
        <div class="stat-card"><span>Low Water</span><h2 id="lowCount" style="color:var(--amber)">-</h2></div>
      </div>

      <div class="search-bar">
        <input id="searchBox" type="text" placeholder="Search Telangana district..." />
        <select id="statusFilter">
          <option value="ALL">All</option>
          <option value="Normal">Normal</option>
          <option value="High Turbidity">High Turb</option>

    <!-- TAB 2: MAP -->

    <!-- TAB 3: AI DIGITAL TWIN SIMULATOR -->
    <section id="view-sim" class="view">
      <div class="sim-head">
        <select id="simSelect"></select>
        <button class="btn-reset" onclick="resetSliders()">Reset</button>
      </div>

      <div class="card">
        <div class="slider-row">
          <div class="slider-top"><span>Rainfall Change</span><b id="rainVal">0%</b></div>
          <input id="rainSlider" type="range" min="-50" max="50" value="0" />
        </div>
        <div class="slider-row">
          <div class="slider-top"><span>Temperature Change</span><b id="tempVal">0°C</b></div>
          <input id="tempSlider" type="range" min="-3" max="5" step="0.5" value="0" />
        </div>
        <div class="slider-row">
          <div class="slider-top"><span>Pollution Load</span><b id="pollVal">0%</b></div>
          <input id="pollSlider" type="range" min="-30" max="50" value="0" />
        </div>
      </div>

      <div class="card">
        <div class="metrics-grid">
          <div class="m-box"><small>Projected WQI</small><strong id="simWqi" style="color:var(--blue)">-</strong></div>
          <div class="m-box"><small>Risk Level</small><strong id="simRisk">-</strong></div>
          <div class="m-box"><small>Turbidity Index</small><strong id="simTurb">-</strong></div>
          <div class="m-box"><small>Water Coverage</small><strong id="simWater">-</strong></div>
        </div>
      </div>

      <div class="card">
        <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">AI Recommendation</div>
        <div id="simAction" class="ai-rec">-</div>
      </div>

      <div class="card">
        <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">6-Month WQI Forecast</div>
        <div class="chart-box"><canvas id="forecastChart"></canvas></div>
      </div>
    </section>
  </main>

  <nav>
    <button class="tab active" onclick="switchTab('list', this)"><span class="ico">📊</span><span>Districts</span></button>
    <button class="tab" onclick="switchTab('map', this)"><span class="ico">🗺️</span><span>Map</span></button>
    <button class="tab" onclick="switchTab('sim', this)"><span class="ico">⚡</span><span>AI Twin</span></button>
  </nav>

  <script>
    // 1. Offline AI Engine (Instant 60fps local calculation)
    function getStatus(turb, water) {
      if (isNaN(turb)) return 'Unknown';
      if (turb >= 1.15) return 'High Turbidity';
      if (!isNaN(water) && water < 1.0) return 'Low Water';
      return 'Normal';
    }

    function computeAI(turb, water, ndwi) {
      const t = isNaN(turb) ? 1.0 : turb;
      const w = isNaN(water) ? 1.5 : water;
      const n = isNaN(ndwi) ? -0.45 : ndwi;

      const raw = 88.0 - Math.max(0, (t - 0.95) * 110.0) + Math.min(10.0, w * 2.2) + (n + 0.5) * 20.0;
      const wqi = Number(Math.max(15.0, Math.min(98.0, raw)).toFixed(1));

      let risk = 'Low Risk';
      let action = 'Water clarity and storage levels are within safe targets.';
      if (wqi < 55) {
        risk = 'High Risk';
        action = 'Deploy sediment filtration & inspect runoff sources immediately.';
      } else if (wqi < 72) {
        risk = 'Moderate Risk';
        action = 'Increase weekly monitoring & optimize local reservoir inflow.';
      }
      if (w < 1.0) action = 'Trigger drought conservation plan & prioritize groundwater recharge.';

      return { wqi, risk, action };
    }

    // 2. Load packed Telangana data
    const districts = (window.TELANGANA_DATA || []).map(r => {
      const lat = Number(r.latitude);
      const lng = Number(r.longitude);
      const ndwi = Number(r.ndwi_mean);
      const turb = Number(r.turbidity_index);
      const water = Number(r.water_coverage_pct);
      const status = getStatus(turb, water);
      const ai = computeAI(turb, water, ndwi);
      return {
        district: r.district,
        lat, lng,
        ndwi: Number(ndwi.toFixed(4)),
        turb: Number(turb.toFixed(4)),
        water: Number(water.toFixed(4)),
        status,
        ...ai
      };
    });

    let selected = districts[0];
    let map, forecastChart;

    function statusClass(s) {
      if (s === 'High Turbidity') return 'High';
      if (s === 'Low Water') return 'Low';
      return 'Normal';
    }

    function statusColor(s) {
      if (s === 'High Turbidity') return '#ff453a';
      if (s === 'Low Water') return '#ff9f0a';
      return '#30d158';
    }

    // 3. Tab Switching
    function switchTab(name, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      if (btn) btn.classList.add('active');
      if (name === 'map' && map) setTimeout(() => map.invalidateSize(), 240);
    }

    // 4. Render District List
    function renderList() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      const st = document.getElementById('statusFilter').value;
      const filtered = districts.filter(d =>
        d.district.toLowerCase().includes(q) && (st === 'ALL' || d.status === st)
      );

      const box = document.getElementById('districtList');
      box.innerHTML = '';
      filtered.forEach(d => {
        const el = document.createElement('div');
        el.className = 'd-card';
        el.innerHTML = `
          <div>
            <div class="d-name">${d.district}</div>
            <div class="d-meta">WQI: <b>${d.wqi}</b> • Turb: ${d.turb} • Water: ${d.water}%</div>
          </div>
          <span class="tag ${statusClass(d.status)}">${d.status}</span>
        `;
        el.onclick = () => {
          selected = d;
          document.getElementById('simSelect').value = d.district;
          runSim();
          switchTab('sim', document.querySelectorAll('.tab')[2]);
        };
        box.appendChild(el);
      });
    }

    // 5. Map Setup
    function initMap() {
      map = L.map('map').setView([18.0, 79.1], 7);
      const street = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
        { attribution: '&copy; Esri', maxZoom: 18 }
      ).addTo(map);
      const sat = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: '&copy; Esri', maxZoom: 18 }
      );
      L.control.layers({ 'Map': street, 'Satellite': sat }).addTo(map);

      districts.forEach(d => {
        if (!isNaN(d.lat) && !isNaN(d.lng)) {
          L.circleMarker([d.lat, d.lng], {
            radius: 9, fillColor: statusColor(d.status), color: '#fff', weight: 1.5, fillOpacity: 0.9
          }).bindPopup(`<b>${d.district}</b><br/>Status: ${d.status}<br/>AI WQI: ${d.wqi}/100<br/>Turbidity: ${d.turb}`)
            .on('click', () => {
              selected = d;
              document.getElementById('simSelect').value = d.district;
              runSim();
            })
            .addTo(map);
        }
      });
    }

    // 6. Instant Digital Twin Simulator
    function resetSliders() {
      document.getElementById('rainSlider').value = 0;
      document.getElementById('tempSlider').value = 0;
      document.getElementById('pollSlider').value = 0;
      runSim();
    }

    function runSim() {
      if (!selected) return;
      const rain = Number(document.getElementById('rainSlider').value);
      const temp = Number(document.getElementById('tempSlider').value);
      const poll = Number(document.getElementById('pollSlider').value);

      document.getElementById('rainVal').textContent = (rain > 0 ? '+' : '') + rain + '%';
      document.getElementById('tempVal').textContent = (temp > 0 ? '+' : '') + temp + '°C';
      document.getElementById('pollVal').textContent = (poll > 0 ? '+' : '') + poll + '%';

      const waterFactor = 1.0 + (rain * 0.009) - (temp * 0.045);
      const simWater = Number(Math.max(0.1, selected.water * waterFactor).toFixed(4));
      const simTurb = Number(Math.max(0.5, selected.turb + Math.max(0, rain) * 0.0018 + poll * 0.0045 + Math.max(0, temp) * 0.015).toFixed(4));
      const simNdwi = Number(Math.max(-1, Math.min(1, selected.ndwi + (simWater - selected.water) * 0.04)).toFixed(4));
      const ai = computeAI(simTurb, simWater, simNdwi);

      document.getElementById('simWqi').textContent = ai.wqi + ' / 100';
      const riskEl = document.getElementById('simRisk');
      riskEl.textContent = ai.risk;
      riskEl.style.color = ai.risk === 'High Risk' ? 'var(--red)' : ai.risk === 'Moderate Risk' ? 'var(--amber)' : 'var(--green)';
      document.getElementById('simTurb').textContent = simTurb;
      document.getElementById('simWater').textContent = simWater + '%';
      document.getElementById('simAction').textContent = ai.action;

      const labels = [];
      const scores = [];
      for (let m = 1; m <= 6; m++) {
        const r = m / 6;
        const mT = selected.turb + (simTurb - selected.turb) * r;
        const mW = selected.water + (simWater - selected.water) * r;
        const mN = selected.ndwi + (simNdwi - selected.ndwi) * r;
        labels.push('M+' + m);
        scores.push(computeAI(mT, mW, mN).wqi);
      }

      if (forecastChart) {
        forecastChart.data.labels = labels;
        forecastChart.data.datasets[0].data = scores;
        forecastChart.update('none');
      } else {
        const ctx = document.getElementById('forecastChart').getContext('2d');
        forecastChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              data: scores,
              borderColor: '#0a84ff',
              backgroundColor: 'rgba(10, 132, 255, 0.18)',
              fill: true, tension: 0.38, pointRadius: 4, pointBackgroundColor: '#0a84ff'
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#8e8e93' }, grid: { display: false } },
              y: { min: 10, max: 100, ticks: { color: '#8e8e93' }, grid: { color: 'rgba(255,255,255,0.06)' } }
            }
          }
        });
      }
    }

    // 7. Boot App
    document.getElementById('normalCount').textContent = districts.filter(d => d.status === 'Normal').length;
    document.getElementById('highCount').textContent = districts.filter(d => d.status === 'High Turbidity').length;
    document.getElementById('lowCount').textContent = districts.filter(d => d.status === 'Low Water').length;
    const avg = districts.length ? (districts.reduce((a, b) => a + b.wqi, 0) / districts.length).toFixed(1) : '-';
    document.getElementById('avgWqi').textContent = avg;

    const sel = document.getElementById('simSelect');
    districts.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.district;
      opt.textContent = d.district + ' Twin';
      sel.appendChild(opt);
    });
    sel.onchange = () => {
      selected = districts.find(d => d.district === sel.value);
      runSim();
    };

    ['rainSlider', 'tempSlider', 'pollSlider'].forEach(id =>
      document.getElementById(id).addEventListener('input', runSim)
    );
    document.getElementById('searchBox').addEventListener('input', renderList);
    document.getElementById('statusFilter').addEventListener('change', renderList);

    renderList();
    initMap();
    runSim();
  </script>

<script id="apple-ux-js">
(function(){
  function haptic(){ if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){} }

  function initAppleDashboard(){

        '</div>' +
      '</div>' +
      '<div class="dash-grid" id="dash-kpis"></div>' +
      '<div class="dash-sec">' +
        '<div class="dash-sec-title"><span>Water Stress Distribution</span><span id="dash-total" style="color:#38bdf8">--</span></div>' +
        '<div class="dash-bar"><span id="bar-safe" style="background:#22c55e;width:50%"></span><span id="bar-mod" style="background:#f59e0b;width:30%"></span><span id="bar-crit" style="background:#ef4444;width:20%"></span></div>' +
        '<div class="dash-leg"><span id="leg-safe">Safe</span><span id="leg-mod">Moderate</span><span id="leg-crit">Critical</span></div>' +
      '</div>' +
      '<div class="dash-sec">' +
        '<div class="dash-sec-title"><span>Priority Watchlist</span><span id="dash-see-all" style="color:#38bdf8;font-size:12px;cursor:pointer">See All</span></div>' +
        '<div id="dash-watch"></div>' +
      '</div>' +
      '<div class="dash-actions">' +
        '<button class="dash-action" id="dash-go-map">Live Water Map<small>Inspect spatial layers</small></button>' +
        '<button class="dash-action" id="dash-go-sim">AI Twin Simulator<small>Run what-if scenarios</small></button>' +
      '</div>';

    listView.parentNode.insertBefore(dash, listView);
    document.querySelectorAll('.view').forEach(function(v){ if(v.id !== 'view-dash') v.classList.remove('active'); });

    var tabBar = firstTab.parentNode;
    var dashTab = document.createElement('button');
    dashTab.id = 'tab-dash';
    dashTab.className = 'tab active';
    dashTab.innerHTML = '<span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>Home</span>';

    tabBar.querySelectorAll('.tab').forEach(function(t){
      t.classList.remove('active');
      t.addEventListener('click', function(){
        haptic();
        dash.classList.remove('active');
        dashTab.classList.remove('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    tabBar.insertBefore(dashTab, firstTab);

    dashTab.addEventListener('click', function(){
      haptic();
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      tabBar.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      dash.classList.add('active');
      dashTab.classList.add('active');
      syncDash();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function clickTabIndex(idx){
      var tabs = tabBar.querySelectorAll('.tab');
      if(tabs[idx]) tabs[idx].click();
    }
    document.getElementById('dash-see-all').onclick = function(){ clickTabIndex(1); };
    document.getElementById('dash-go-map').onclick = function(){ clickTabIndex(2); };
    document.getElementById('dash-go-sim').onclick = function(){ clickTabIndex(3); };

    function syncDash(){
      var kpiBox = document.getElementById('dash-kpis');
      var stats = listView.querySelectorAll('.stats > div');
      if(stats.length){
        var html = '';
        for(var i=0; i<Math.min(stats.length, 4); i++){
          var parts = stats[i].innerText.trim().split('\n').filter(Boolean);
          var val = parts[0] || '--';
          var lbl = parts[1] || 'Metric';
          if(parts.length >= 2 && /[a-zA-Z]{3,}/.test(parts[0]) && /\d/.test(parts[1])){ lbl = parts[0]; val = parts[1]; }
          html += '<div class="dash-tile"><small>' + lbl + '</small><strong>' + val + '</strong></div>';
        }
        kpiBox.innerHTML = html;
      }

      var cards = listView.querySelectorAll('.card');
      var total = cards.length, crit = 0, mod = 0, safe = 0, watch = [];
      cards.forEach(function(c){
        var txt = c.innerText || '';
        var nameEl = c.querySelector('.d-name');
        var name = nameEl ? nameEl.innerText.trim() : txt.split('\n')[0];
        var isCrit = /critical|high|severe|over|danger/i.test(txt);
        var isMod = !isCrit && /mod|warn|semi|medium/i.test(txt);
        if(isCrit){ crit++; watch.push({ name: name, status: 'Critical', el: c }); }
        else if(isMod){ mod++; if(watch.length < 3) watch.push({ name: name, status: 'Moderate', el: c }); }
        else { safe++; }
      });

      if(total > 0){
        var score = Math.round(((safe * 100) + (mod * 60) + (crit * 20)) / total);
        document.getElementById('dash-score').textContent = score + '%';
        document.getElementById('dash-arc').style.strokeDashoffset = (213.6 - (213.6 * score / 100)).toFixed(1);
        document.getElementById('dash-total').textContent = total + ' Districts';
        document.getElementById('bar-safe').style.width = (safe/total*100) + '%';
        document.getElementById('bar-mod').style.width = (mod/total*100) + '%';
        document.getElementById('bar-crit').style.width = (crit/total*100) + '%';
        document.getElementById('leg-safe').textContent = 'Safe: ' + safe;
        document.getElementById('leg-mod').textContent = 'Moderate: ' + mod;
        document.getElementById('leg-crit').textContent = 'Critical: ' + crit;
      }

      var wBox = document.getElementById('dash-watch');
      if(watch.length){
        wBox.innerHTML = '';
        watch.slice(0, 3).forEach(function(w){
          var row = document.createElement('div');
          row.className = 'dash-item';
          row.innerHTML = '<div><b>' + w.name + '</b><small>Tap to view details</small></div><span class="dash-badge">' + w.status + '</span>';
          row.onclick = function(){ clickTabIndex(1); };
          wBox.appendChild(row);
        });
      } else {
        wBox.innerHTML = '<div class="dash-item"><div><b>All Districts Monitored</b><small>Tap See All to browse full list</small></div><span class="dash-badge">Live</span></div>';
      }
    }

    syncDash();
    setTimeout(syncDash, 400);
    new MutationObserver(syncDash).observe(listView, { childList: true, subtree: true });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAppleDashboard);
  else initAppleDashboard();
})();
</script>

<script id="aquatwin-pro-js">
(function(){
  function haptic(){ if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){} }
  function toast(msg){
    var t = document.getElementById('at-toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function getDistricts(){
    var list = [];
    var cards = document.querySelectorAll('#view-list .card');
    cards.forEach(function(c){
      var txt = (c.innerText || '').trim();
      var nameEl = c.querySelector('.d-name');
      var name = nameEl ? nameEl.innerText.trim() : txt.split('\n')[0];
      var wqiMatch = txt.match(/WQI[:\s]*([0-9.]+)/i) || txt.match(/([0-9]{2}(?:\.[0-9])?)\s*\/\s*100/);
      var wqi = wqiMatch ? parseFloat(wqiMatch[1]) : null;
      var risk = /critical|high|severe|over|danger/i.test(txt) ? 'Critical' : (/mod|warn|semi|medium/i.test(txt) ? 'Moderate' : 'Safe');
      list.push({ name: name, risk: risk, wqi: wqi, text: txt });
    });
    return list;
  }

  function initPro(){

    // 3. Header Buttons (Alerts + Report)

      hdr.style.alignItems = 'center';
      hdr.style.justifyContent = 'space-between';

        '<button class="at-ico-btn" id="at-btn-alerts" title="Alerts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="at-badge" id="at-alert-cnt">0</span></button>';
      hdr.appendChild(tools);
    }

    // 4. Floating Ask-AI Button
    var fab = document.createElement('button');
    fab.id = 'at-fab';
    fab.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2a7 7 0 0 1 7 7c0 2.6-1.4 4.9-3.5 6.1L14 19h-4l-1.5-3.9A7 7 0 0 1 12 2z"/><line x1="9" y1="22" x2="15" y2="22"/></svg><span>Ask AI</span>';
    document.body.appendChild(fab);

    // 5. Shared Sheet Container
    var bd = document.createElement('div');
    bd.className = 'at-backdrop';
    bd.id = 'at-backdrop';
    bd.innerHTML = '<div class="at-sheet" id="at-sheet"></div>';
    document.body.appendChild(bd);

    function closeSheet(){ bd.classList.remove('open'); }
    function openSheet(innerHtml){
      haptic();
      document.getElementById('at-sheet').innerHTML = '<div class="at-grab"></div>' + innerHtml;
      bd.classList.add('open');
      try{ history.pushState({ sheet: true }, ''); }catch(e){}
      var cBtn = document.getElementById('at-sh-close');
      if(cBtn) cBtn.onclick = closeSheet;
    }
    bd.addEventListener('click', function(e){ if(e.target === bd) closeSheet(); });

    // Alerts Sheet
    function updateBadge(){
      var ds = getDistricts();
      var cnt = ds.filter(function(d){ return d.risk !== 'Safe'; }).length;
      var el = document.getElementById('at-alert-cnt');
      if(el){ el.textContent = cnt; el.style.display = cnt ? 'flex' : 'none'; }
    }
    setTimeout(updateBadge, 600);
    setInterval(updateBadge, 4000);

    var alertBtn = document.getElementById('at-btn-alerts');
    if(alertBtn) alertBtn.onclick = function(){
      var ds = getDistricts().filter(function(d){ return d.risk !== 'Safe'; });
      var rows = ds.length ? ds.map(function(d){
        return '<div class="at-alert-row ' + (d.risk==='Moderate'?'mod':'') + '"><div><b>' + d.name + '</b><div style="font-size:11px;color:#94a3b8">' + (d.wqi ? 'WQI: ' + d.wqi + '/100' : 'Elevated water stress') + '</div></div><span class="dash-badge" style="color:' + (d.risk==='Critical'?'#fca5a5':'#fcd34d') + '">' + d.risk + '</span></div>';
      }).join('') : '<div style="padding:14px;color:#94a3b8">No critical anomalies detected right now.</div>';
      openSheet('<div class="at-sh-head"><h3>Water Risk Alerts (' + ds.length + ')</h3><button class="at-close" id="at-sh-close">&times;</button></div>' + rows);

    // Report Sheet
    var repBtn = document.getElementById('at-btn-rep');
    if(repBtn) repBtn.onclick = function(){

        'AI Recommendation:\nPrioritize turbidity filtration, recharge pits, and digital-twin drought simulation for high-risk zones.';

      openSheet(
        '<div class="at-sh-head"><h3>Submission Report</h3><button class="at-close" id="at-sh-close">&times;</button></div>' +
        '<div class="at-rep-box" id="at-rep-txt">' + reportText + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          '<button class="at-btn-primary" id="at-copy-rep">Copy Report</button>' +
          '<button class="at-btn-primary" style="background:rgba(255,255,255,0.12);color:#fff" id="at-share-rep">Share</button>' +
        '</div>'
      );
      document.getElementById('at-copy-rep').onclick = function(){
        var ta = document.createElement('textarea');

        ta.remove();
      };
      document.getElementById('at-share-rep').onclick = function(){
        if(navigator.share){ navigator.share({ title: 'AquaTwin AI Report', text: reportText }).catch(function(){}); }
        else { document.getElementById('at-copy-rep').click(); }
      };
    };

    // Offline AI Assistant Sheet
    function answerAI(q){
      var ql = q.toLowerCase();
      var ds = getDistricts();
      var match = ds.find(function(d){ return d.name && ql.indexOf(d.name.toLowerCase()) !== -1; });
      if(match){
        return match.name + ' District Analysis:\nStatus: ' + match.risk + (match.wqi ? ' | WQI: ' + match.wqi + '/100' : '') + '\n\nLive Reading:\n' + match.text.slice(0, 180) + '\n\nTip: Open AI Twin tab to test rainfall & temperature scenarios for ' + match.name + '.';
      }
      if(/crit|high|risk|worst|alert|danger/.test(ql)){
        var bad = ds.filter(function(d){ return d.risk !== 'Safe'; }).slice(0,5);
        return bad.length ? 'Top Priority Districts:\n' + bad.map(function(d){ return '- ' + d.name + ' (' + d.risk + (d.wqi ? ', WQI ' + d.wqi : '') + ')'; }).join('\n') : 'All monitored districts are currently in Safe condition.';
      }
      if(/best|safe|good|clean/.test(ql)){
        var good = ds.filter(function(d){ return d.risk === 'Safe'; }).slice(0,5);
        return 'Healthiest Districts:\n' + good.map(function(d){ return '- ' + d.name + (d.wqi ? ' (WQI ' + d.wqi + ')' : ' (Safe)'); }).join('\n');
      }
      if(/drought|plan|action|recommend|fix/.test(ql)){
        return 'AquaTwin AI Action Plan:\n1. Deploy check-dams & groundwater recharge in Moderate/Critical districts.\n2. Monitor high-turbidity reservoirs using Sentinel-2 NDWI updates.\n3. Simulate -15% rainfall stress in the AI Twin tab before summer.';
      }
      var critC = ds.filter(function(d){ return d.risk==='Critical'; }).length;
      var modC = ds.filter(function(d){ return d.risk==='Moderate'; }).length;
      var safeC = ds.filter(function(d){ return d.risk==='Safe'; }).length;
      return 'Telangana Summary (' + ds.length + ' districts):\n- Safe: ' + safeC + '\n- Moderate: ' + modC + '\n- Critical: ' + critC + '\n\nAsk me about any district name (e.g. Hyderabad, Jangaon, Warangal) or tap a quick button above.';
    }

    fab.onclick = function(){
      openSheet(
        '<div class="at-sh-head"><h3>AquaTwin AI Analyst</h3><button class="at-close" id="at-sh-close">&times;</button></div>' +
        '<div class="at-chips">' +
          '<button class="at-chip">State Summary</button>' +
          '<button class="at-chip">Critical Districts</button>' +
          '<button class="at-chip">Best Water Quality</button>' +
          '<button class="at-chip">Drought Action Plan</button>' +
        '</div>' +
        '<div class="at-chat" id="at-chat"><div class="at-msg bot">Hi! I analyze all 33 Telangana districts offline. Tap a topic or type any district name.</div></div>' +
        '<div class="at-input-row"><input id="at-q" placeholder="Ask about a district (e.g. Hyderabad)..."/><button class="at-btn-primary" id="at-send">Ask</button></div>'
      );
      var chat = document.getElementById('at-chat');
      var inp = document.getElementById('at-q');
      function ask(txt){
        if(!txt.trim()) return;
        haptic();
        chat.innerHTML += '<div class="at-msg usr">' + txt + '</div><div class="at-msg bot">' + answerAI(txt) + '</div>';
        chat.scrollTop = chat.scrollHeight;
        inp.value = '';
      }
      document.getElementById('at-send').onclick = function(){ ask(inp.value); };
      inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') ask(inp.value); });
      document.querySelectorAll('.at-chip').forEach(function(ch){ ch.onclick = function(){ ask(ch.textContent); }; });
    };

    // 6. Live Telemetry Timestamp Pulse on Dashboard
    setInterval(function(){
      var sub = document.getElementById('dash-sub');
      if(sub) sub.textContent = 'Live Digital Twin Sync - ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }, 3000);

    // 7. Hardware Android Back Button handling
    window.addEventListener('popstate', function(){
      if(bd.classList.contains('open')){ closeSheet(); return; }
      var dashTab = document.getElementById('tab-dash');
      if(dashTab && !dashTab.classList.contains('active')){ dashTab.click(); toast('Returned to Home'); }
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPro);
  else initPro();
})();
</script>

<script id="polish-v2-js">
(function(){
  function applyPolishV2(){
    // 1. Fix bottom bar: 1 row, Home far left -> Districts -> Map -> AI Twin far right
    var anyTab = document.querySelector('.tab');
    if (anyTab && anyTab.parentNode) {
      var bar = anyTab.parentNode;
      bar.classList.add('at-tabbar-fixed');
      var tabs = Array.prototype.slice.call(bar.querySelectorAll('.tab'));
      var homeT = document.getElementById('tab-dash') || tabs.find(function(t){ return /home/i.test(t.innerText); });
      var distT = tabs.find(function(t){ return /district/i.test(t.innerText); });
      var mapT  = tabs.find(function(t){ return /map/i.test(t.innerText); });
      var aiT   = tabs.find(function(t){ return /ai|twin/i.test(t.innerText); });

      [homeT, distT, mapT, aiT].forEach(function(t){ if (t) bar.appendChild(t); });

      var icons = {
        home: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>',
        dist: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>',
        map:  '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>',
        ai:   '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
      };
      if (homeT) { var i1 = homeT.querySelector('.ico'); if (i1) i1.innerHTML = icons.home; }
      if (distT) { var i2 = distT.querySelector('.ico'); if (i2) i2.innerHTML = icons.dist; }
      if (mapT)  { var i3 = mapT.querySelector('.ico');  if (i3) i3.innerHTML = icons.map; }
      if (aiT)   { var i4 = aiT.querySelector('.ico');   if (i4) i4.innerHTML = icons.ai; }
    }

    // 2. Populate Health Ring, Stress Distribution & Priority Watchlist from real Telangana data
    var rows = window.TELANGANA_DATA;
    if (Array.isArray(rows) && rows.length) {
      var total = rows.length, safe = 0, mod = 0, crit = 0, sumWqi = 0, scored = [];
      rows.forEach(function(r){
        var t = parseFloat(r.turbidity_index); if (isNaN(t)) t = 1.05;
        var w = parseFloat(r.water_coverage_pct); if (isNaN(w)) w = 1.5;
        var n = parseFloat(r.ndwi_mean); if (isNaN(n)) n = -0.45;
        var raw = 88 - Math.max(0, (t - 0.95) * 110) + Math.min(10, w * 2.2) + (n + 0.5) * 20;
        var wqi = Math.round(Math.max(15, Math.min(98, raw)) * 10) / 10;
        sumWqi += wqi;
        var status = t >= 1.15 ? 'High Turbidity' : (w < 1.0 ? 'Low Water' : 'Normal');
        if (status === 'Low Water') crit++;
        else if (status === 'High Turbidity') mod++;
        else safe++;
        scored.push({ name: r.district || 'District', wqi: wqi, status: status, turb: t.toFixed(2) });
      });

      var avgWqi = Math.round((sumWqi / total) * 10) / 10;
      var sc = document.getElementById('dash-score');
      var arc = document.getElementById('dash-arc');
      if (sc) sc.textContent = Math.round(avgWqi) + '%';
      if (arc) arc.style.strokeDashoffset = (213.6 - (213.6 * avgWqi / 100)).toFixed(1);

      var dt = document.getElementById('dash-total');
      if (dt) dt.textContent = total + ' Districts';
      var bs = document.getElementById('bar-safe'), bm = document.getElementById('bar-mod'), bc = document.getElementById('bar-crit');
      if (bs) bs.style.width = (safe / total * 100) + '%';
      if (bm) bm.style.width = (mod / total * 100) + '%';
      if (bc) bc.style.width = (crit / total * 100) + '%';
      var ls = document.getElementById('leg-safe'), lm = document.getElementById('leg-mod'), lc = document.getElementById('leg-crit');
      if (ls) ls.textContent = 'Normal: ' + safe;
      if (lm) lm.textContent = 'High Turbidity: ' + mod;
      if (lc) lc.textContent = 'Low Water: ' + crit;

      var wb = document.getElementById('dash-watch');
      if (wb) {
        scored.sort(function(a, b){ return a.wqi - b.wqi; });
        wb.innerHTML = '';
        scored.slice(0, 3).forEach(function(d){
          var item = document.createElement('div');
          item.className = 'dash-item';
          item.innerHTML = '<div><b>' + d.name + '</b><small>WQI ' + d.wqi + ' &bull; Turbidity ' + d.turb + '</small></div><span class="dash-badge">' + d.status + '</span>';
          item.onclick = function(){
            var tabs = document.querySelectorAll('.at-tabbar-fixed .tab');
            if (tabs[1]) tabs[1].click();
          };
          wb.appendChild(item);
        });
      }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(applyPolishV2, 120); });
  else setTimeout(applyPolishV2, 120);
})();
</script>

<script id="final-polish-js">
(function(){
  function getScoredDistricts(){
    var rows = window.TELANGANA_DATA;
    if (!Array.isArray(rows) || !rows.length) return [];
    return rows.map(function(r){
      var t = parseFloat(r.turbidity_index); if (isNaN(t)) t = 1.05;
      var w = parseFloat(r.water_coverage_pct); if (isNaN(w)) w = 1.5;
      var n = parseFloat(r.ndwi_mean); if (isNaN(n)) n = -0.45;
      var raw = 88 - Math.max(0, (t - 0.95) * 110) + Math.min(10, w * 2.2) + (n + 0.5) * 20;
      var wqi = Math.round(Math.max(15, Math.min(98, raw)) * 10) / 10;
      var status = t >= 1.15 ? 'High Turbidity' : (w < 1.0 ? 'Low Water' : 'Normal');
      return { name: String(r.district || 'District').trim(), wqi: wqi, status: status, turb: t, water: w };
    }).sort(function(a, b){ return a.wqi - b.wqi; });
  }

  function renderRealWatchlist(){
    var wb = document.getElementById('dash-watch');
    if (!wb) return;
    var scored = getScoredDistricts();
    if (!scored.length) return;

    wb.innerHTML = '';
    scored.slice(0, 3).forEach(function(d){
      var row = document.createElement('div');
      row.className = 'dash-item';
      var badgeColor = d.status === 'Low Water' ? '#fca5a5' : (d.status === 'High Turbidity' ? '#fcd34d' : '#7dd3fc');
      row.innerHTML =
        '<div><b>' + d.name + '</b><small>WQI ' + d.wqi + ' &bull; Turbidity ' + d.turb.toFixed(2) + ' &bull; Water ' + d.water.toFixed(1) + '%</small></div>' +
        '<span class="dash-badge" style="color:' + badgeColor + '">' + d.status + '</span>';
      row.onclick = function(){
        var sel = document.querySelector('select');
        if (sel) {
          for (var i = 0; i < sel.options.length; i++) {
            if (sel.options[i].text.toLowerCase().indexOf(d.name.toLowerCase()) !== -1) {
              sel.selectedIndex = i;
              sel.dispatchEvent(new Event('change', { bubbles: true }));
              break;
            }
          }
        }
        var tabs = document.querySelectorAll('.at-tabbar-fixed .tab, .tab');
        if (tabs[3]) tabs[3].click();
        else if (tabs[1]) tabs[1].click();
      };
      wb.appendChild(row);
    });
  }

  function initDemoMode(){
    var pill = document.querySelector('.dash-pill');
    if (!pill || document.getElementById('at-demo-btn')) return;

    var btn = document.createElement('button');
    btn.id = 'at-demo-btn';
    btn.className = 'at-demo-btn';
    btn.textContent = 'Demo: OFF';
    pill.parentNode.insertBefore(btn, pill.nextSibling);

    var ticker = document.createElement('div');
    ticker.id = 'at-demo-ticker';
    ticker.className = 'at-demo-ticker';
    var sub = document.getElementById('dash-sub');
    if (sub && sub.parentNode) sub.parentNode.appendChild(ticker);

    var timer = null, idx = 0;
    btn.onclick = function(){
      var scored = getScoredDistricts();
      if (!scored.length) return;
      if (timer) {
        clearInterval(timer);
        timer = null;
        btn.textContent = 'Demo: OFF';
        btn.classList.remove('on');
        ticker.classList.remove('show');
        return;
      }
      btn.textContent = 'Demo: LIVE';
      btn.classList.add('on');
      ticker.classList.add('show');

      function step(){
        var d = scored[idx % Math.min(8, scored.length)];
        var delta = ((Math.random() - 0.5) * 1.4).toFixed(1);
        var liveWqi = Math.max(15, Math.min(98, d.wqi + parseFloat(delta))).toFixed(1);
        ticker.textContent = 'Live Telemetry: ' + d.name + ' | WQI ' + liveWqi + ' (' + (delta >= 0 ? '+' : '') + delta + ') | ' + d.status;
        idx++;
      }
      step();
      timer = setInterval(step, 3000);
    };
  }

  function lockDashboard(){
    renderRealWatchlist();
    initDemoMode();
    var homeTab = document.getElementById('tab-dash');
    if (homeTab && !homeTab._wlBound) {
      homeTab._wlBound = true;
      homeTab.addEventListener('click', function(){ setTimeout(renderRealWatchlist, 80); });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){
      setTimeout(lockDashboard, 650);
      setTimeout(renderRealWatchlist, 1400);
    });
  } else {
    setTimeout(lockDashboard, 650);
    setTimeout(renderRealWatchlist, 1400);
  }
})();
</script>

<script id="ml-lstm-js">
(function(){
  function getMlMap(){
    var mp = {};
    var data = window.AQUATWIN_ML_DATA;
    if (data && Array.isArray(data.districts)) {
      data.districts.forEach(function(d){
        if (d && d.district) mp[String(d.district).trim().toLowerCase()] = d;
      });
    }
    return mp;
  }

  function findSelectedDistrictName(){
    var sel = document.querySelector('select');
    if (sel && sel.options && sel.options.length > 0) {
      var txt = sel.options[sel.selectedIndex].text || '';
      return txt.replace(/\s*Digital Twin.*$/i, '').replace(/\s*Twin.*$/i, '').trim();
    }
    return 'Hyderabad';
  }

  function renderMlPanel(){
    var mp = getMlMap();
    var keys = Object.keys(mp);
    if (!keys.length) return;

    var curName = findSelectedDistrictName();
    var rec = mp[curName.toLowerCase()] || mp['hyderabad'] || mp[keys[0]];
    if (!rec) return;

    var host = document.getElementById('at-ml-panel');
    if (!host) {
      host = document.createElement('div');
      host.id = 'at-ml-panel';
      host.className = 'at-ml-card';
      var simCard = document.querySelector('#view-sim .card, #screen-sim .card, .sim-card');
      if (simCard && simCard.parentNode) {
        simCard.parentNode.insertBefore(host, simCard.nextSibling);
      } else {
        var dash = document.getElementById('view-dash') || document.getElementById('screen-home') || document.body;
        dash.appendChild(host);
      }
    }

    var f6 = Array.isArray(rec.forecast_6m) ? rec.forecast_6m : [];
    var fSummary = f6.map(function(x){ return x.month + ':' + x.lstm_wqi; }).join(' • ');

    host.innerHTML =
      '<div class="at-ml-top">' +
        '<span>XGBoost + LSTM Engine (' + rec.district + ')</span>' +
        '<span class="at-ml-pill">R2 0.99 / 0.89</span>' +
      '</div>' +
      '<div class="at-ml-grid">' +
        '<div class="at-ml-cell"><span>XGBoost WQI</span><b>' + rec.xgb_wqi + '</b></div>' +
        '<div class="at-ml-cell"><span>LSTM +1M</span><b>' + rec.lstm_1m_wqi + '</b></div>' +
        '<div class="at-ml-cell"><span>LSTM +6M</span><b>' + rec.lstm_6m_wqi + '</b></div>' +
      '</div>' +
      (fSummary ? '<div style="margin-top:8px;font-size:10.5px;color:#cbd5e1;line-height:1.35">6M Trajectory: ' + fSummary + '</div>' : '');
  }

  function bindMlEvents(){
    renderMlPanel();
    var sel = document.querySelector('select');
    if (sel && !sel._mlBound) {
      sel._mlBound = true;
      sel.addEventListener('change', function(){ setTimeout(renderMlPanel, 50); });
    }
    document.querySelectorAll('.tab').forEach(function(t){
      if (!t._mlTabBound) {
        t._mlTabBound = true;
        t.addEventListener('click', function(){ setTimeout(renderMlPanel, 80); });
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(bindMlEvents, 500); });
  } else {
    setTimeout(bindMlEvents, 500);
  }
})();
</script>

  function editDistance(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 99;
    var dp = [];
    for (var i = 0; i <= a.length; i++) dp[i] = [i];
    for (var j = 0; j <= b.length; j++) dp[0][j] = j;
    for (var i = 1; i <= a.length; i++) {
      for (var j = 1; j <= b.length; j++) {
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
    }
    return dp[a.length][b.length];
  }

  function findMentionedDistricts(query, list) {
    var clean = query.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").trim();
    var padded = " " + clean + " ";
    var words = clean.split(/\s+/).filter(function(w) { return w.length >= 4; });
    var matches = [];
    var seen = {};

    function addMatch(d) {
      if (d && !seen[d._name]) {
        seen[d._name] = true;
        matches.push(d);
      }
    }

    list.forEach(function(d) {
      var dn = d._name.toLowerCase();
      var firstWord = dn.split(/[\s-]/)[0];
      if (padded.indexOf(" " + dn + " ") !== -1 || (firstWord.length >= 5 && padded.indexOf(" " + firstWord + " ") !== -1)) {
        addMatch(d);
      }
    });

    Object.keys(DISTRICT_ALIASES).forEach(function(alias) {
      if (padded.indexOf(" " + alias + " ") !== -1) {
        var target = DISTRICT_ALIASES[alias];
        addMatch(list.find(function(x) { return x._name.toLowerCase() === target.toLowerCase(); }));
      }
    });

    // Fuzzy match for slight spelling typos (e.g., "hyderbad", "warngal")
    if (matches.length === 0) {
      words.forEach(function(w) {
        list.forEach(function(d) {
          var firstWord = d._name.toLowerCase().split(/[\s-]/)[0];
          if (firstWord.length >= 5 && editDistance(w, firstWord) <= 2) {
            addMatch(d);
          }
        });
      });
    }

    return matches;
  }

      var tid = setTimeout(function() { ctrl.abort(); }, 2500);
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + Number(lat || 17.385).toFixed(4) +
                "&longitude=" + Number(lon || 78.4867).toFixed(4) +
                "&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m" +
                "&daily=precipitation_sum&forecast_days=3&timezone=Asia%2FKolkata";
      var res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(tid);
      if (!res.ok) return null;
      var data = await res.json();
      if (!data || !data.current) return null;
      var rain3d = 0;
      if (data.daily && Array.isArray(data.daily.precipitation_sum)) {
        rain3d = data.daily.precipitation_sum.slice(0, 3).reduce(function(a, b) { return a + (Number(b) || 0); }, 0);
      }
      return {
        temp: data.current.temperature_2m,
        humidity: data.current.relative_humidity_2m,
        rain3d: rain3d.toFixed(1)
      };
    } catch (e) {
      return null;
    }
  }

  function buildDistrictReportHtml(d, wx) {
    var wxLine = wx
      ? "<b>Live Weather:</b> " + wx.temp + "°C, Humidity " + wx.humidity + "%, 3-Day Rain " + wx.rain3d + " mm"
      : "<b>Basin Climate:</b> Temp " + d._temp + "°C, Rainfall " + d._rain + " mm";

    var action = d._status.tier === "turbid"
      ? "<b>Recommended Action:</b> High turbidity detected — run inflow filtration, restrict industrial discharge, and monitor supply intakes."
      : (d._status.tier === "medium"
          ? "<b>Recommended Action:</b> Medium water quality — monitor turbidity levels and balance reservoir storage."
          : "<b>Recommended Action:</b> Water quality is safe and within normal supply targets.");

    var s6Meta = statusMetaFromScore(d._s6);

    return (
      "<b>" + d._name + " — Water Quality &amp; Live Report</b><br>" +
      "Current Condition: " + d._status.html + "<br><br>" +
      "• <b>1-Month Score:</b> " + d._s1 + "/100 (" + d._status.html + ")<br>" +
      "• <b>6-Month Score:</b> " + d._s6 + "/100 (" + s6Meta.html + ")<br>" +
      "• <b>Turbidity Index:</b> " + d._turb + " | <b>Water Coverage:</b> " + d._cov + "%<br>" +
      "• <b>Primary Factor:</b> " + d._driver + "<br>" +
      "• " + wxLine + "<br><br>" +
      action
    );
  }

  async function generateCleanHtmlReply(userQuery) {
    var list = getAllDistricts();
    var q = (userQuery || "").trim();
    var low = q.toLowerCase();

    var safeCount = list.filter(function(d) { return d._status.tier === "safe"; }).length;
    var medCount = list.filter(function(d) { return d._status.tier === "medium"; }).length;
    var turbidCount = list.filter(function(d) { return d._status.tier === "turbid"; }).length;
    var avgScore = (list.reduce(function(s, d) { return s + d._s1; }, 0) / Math.max(1, list.length)).toFixed(1);
    var stateMeta = statusMetaFromScore(Number(avgScore));

    if (low.indexOf("state summary") !== -1 || low === "summary") {
      var wxState = await fetchLiveOpenMeteo(17.85, 79.15);
      var wxText = wxState
        ? "<br><b>Live Telangana Weather:</b> " + wxState.temp + "°C, Humidity " + wxState.humidity + "%, 3-Day Rain " + wxState.rain3d + " mm."
        : "";
      return (
        "<b>Telangana Water Summary (33 Districts):</b><br><br>" +
        "• <span class='at-st-safe'>Safe</span>: <b>" + safeCount + " districts</b><br>" +
        "• <span class='at-st-medium'>Medium</span>: <b>" + medCount + " districts</b><br>" +
        "• <span class='at-st-turbid'>High Turbidity</span>: <b>" + turbidCount + " districts</b><br><br>" +
        "<b>State Average Score:</b> " + avgScore + "/100 (" + stateMeta.html + ")" + wxText + "<br><br>" +
        "Type any district name (e.g. <b>Hyderabad</b>, <b>Warangal</b>, <b>Jangaon</b>) for live weather and forecast details."
      );
    }

    if (low.indexOf("critical") !== -1 || low.indexOf("turbid") !== -1 || low.indexOf("risk") !== -1) {
      if (findMentionedDistricts(q, list).length === 0) {
        var worst = list.slice().sort(function(a, b) { return a._s1 - b._s1; }).slice(0, 7);
        var wlines = worst.map(function(d, i) {
          return (i + 1) + ". <b>" + d._name + "</b> — " + d._status.html + " (Score: " + d._s1 + " | Turbidity: " + d._turb + ")";
        });
        return (
          "<b>High Turbidity Districts (" + turbidCount + " High Turbidity / " + medCount + " Medium):</b><br><br>" +
          wlines.join("<br>") + "<br><br>" +
          "Type any district name for live weather and safety actions."
        );
      }
    }

    if (low.indexOf("best water") !== -1 || low.indexOf("cleanest") !== -1 || low.indexOf("safe") !== -1) {
      if (findMentionedDistricts(q, list).length === 0) {
        var best = list.slice().sort(function(a, b) { return b._s1 - a._s1; }).slice(0, 7);
        var blines = best.map(function(d, i) {
          return (i + 1) + ". <b>" + d._name + "</b> — " + d._status.html + " (Score: " + d._s1 + " | Coverage: " + d._cov + "%)";
        });
        return (
          "<b>Safest Water Quality Districts (" + safeCount + " Safe):</b><br><br>" +
          blines.join("<br>")
        );
      }
    }

    if (low.indexOf("drought") !== -1 || low.indexOf("action plan") !== -1) {
      var dry = list.slice().sort(function(a, b) { return a._cov - b._cov; }).slice(0, 5);
      var dlines = dry.map(function(d) {
        return "• <b>" + d._name + "</b>: " + d._status.html + " | Coverage: " + d._cov + "%";
      });
      return (
        "<b>Telangana Water &amp; Drought Action Plan:</b><br><br>" +
        dlines.join("<br>") + "<br><br>" +
        "<b>Priority Actions:</b><br>" +
        "• <span class='at-st-safe'>Safe</span>: Maintain routine tank &amp; reservoir monitoring.<br>" +
        "• <span class='at-st-medium'>Medium</span>: Conserve canal releases and limit evaporation loss.<br>" +
        "• <span class='at-st-turbid'>High Turbidity</span>: Run intake filtration and restrict untreated runoff."
      );
    }

    var mentioned = findMentionedDistricts(q, list);
    if (mentioned.length >= 2) {
      var d1 = mentioned[0];
      var d2 = mentioned[1];
      return (
        "<b>District Water Comparison:</b><br><br>" +
        "• <b>" + d1._name + "</b>: " + d1._status.html + " (Score: " + d1._s1 + " | Turbidity: " + d1._turb + ")<br>" +
        "• <b>" + d2._name + "</b>: " + d2._status.html + " (Score: " + d2._s1 + " | Turbidity: " + d2._turb + ")"
      );
    }

    if (mentioned.length === 1) {
      var target = mentioned[0];
      var wx = await fetchLiveOpenMeteo(target.latitude, target.longitude);
      return buildDistrictReportHtml(target, wx);
    }

    return (
      "<b>Telangana Water Status (" + list.length + " Districts):</b><br>" +
      "<span class='at-st-safe'>Safe</span>: " + safeCount + " | " +
      "<span class='at-st-medium'>Medium</span>: " + medCount + " | " +
      "<span class='at-st-turbid'>High Turbidity</span>: " + turbidCount + "<br><br>" +
      "Ask about any district (e.g. <b>Hyderabad</b>, <b>Warangal</b>, <b>Jangaon</b>) for live weather and forecast details."
    );
  }

  function findAnalystModal() {
    var nodes = document.querySelectorAll("div, section, aside");
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.offsetParent === null) continue;
      var txt = el.textContent || "";
      if (txt.indexOf("AquaTwin AI Analyst") !== -1 && el.querySelector("input")) {
        var r = el.getBoundingClientRect();
        if (r.height > 260 && r.width > 240) {
          el.id = "at-analyst-modal";
          return el;
        }
      }
    }
    return null;
  }

  function purgeEmptyZeroDistrictBubbles(modal) {
    if (!modal) return;
    modal.querySelectorAll("div").forEach(function(el) {
      if (el.children.length === 0 && (el.textContent || "").indexOf("Telangana Summary (0 districts)") !== -1) {
        el.remove();
      }
    });
  }

  function appendBubble(modal, content, isUser, isHtml) {
    var feed = null;
    var divs = modal.querySelectorAll("div");
    for (var i = 0; i < divs.length; i++) {
      var d = divs[i];
      if (d.querySelector("input")) continue;
      if ((d.textContent || "").indexOf("I analyze all 33 Telangana districts") !== -1 && d.children.length >= 1) {
        var st = window.getComputedStyle(d);
        if (st.overflowY === "auto" || st.overflowY === "scroll" || d.scrollHeight >= d.clientHeight) {
          feed = d;
          break;
        }
      }
    }
    if (!feed) {
      for (var j = 0; j < divs.length; j++) {
        if ((divs[j].textContent || "").trim().indexOf("Hi! I analyze all 33 Telangana districts") === 0 && divs[j].children.length === 0) {
          feed = divs[j].parentElement;
          break;
        }
      }
    }
    if (!feed) return null;
    feed.classList.add("at-analyst-feed");

    var sampleBot = null;
    var sampleUser = null;
    Array.from(feed.children).forEach(function(ch) {
      var t = (ch.textContent || "").trim();
      if (t.indexOf("Hi! I analyze") === 0 || t.indexOf("Telangana") === 0) sampleBot = ch;
      else if (t.length > 0) sampleUser = ch;
    });

    var bubble = document.createElement("div");
    if (isUser && sampleUser) bubble.className = sampleUser.className;
    else if (!isUser && sampleBot) bubble.className = sampleBot.className;
    else {
      bubble.style.cssText = isUser
        ? "align-self:flex-end;background:#0ea5e9;color:#fff;padding:10px 14px;border-radius:16px;margin:6px 0;max-width:85%;font-size:13.5px;"
        : "align-self:flex-start;background:#0c1e38;border:1px solid rgba(56,189,248,0.28);color:#e2e8f0;padding:12px 14px;border-radius:16px;margin:6px 0;max-width:92%;font-size:13px;line-height:1.5;";
    }

    if (isHtml) bubble.innerHTML = content;
    else bubble.textContent = content;

    feed.appendChild(bubble);
    feed.scrollTop = feed.scrollHeight;
    return bubble;
  }

  async function submitToAnalyst(modal, queryText) {
    var q = (queryText || "").trim();
    if (!q) return;
    purgeEmptyZeroDistrictBubbles(modal);
    appendBubble(modal, q, true, false);
    var loadingBubble = appendBubble(modal, "Checking live weather & district water status...", false, false);
    var htmlReply = await generateCleanHtmlReply(q);
    purgeEmptyZeroDistrictBubbles(modal);
    if (loadingBubble) loadingBubble.innerHTML = htmlReply;
    else appendBubble(modal, htmlReply, false, true);
  }

  function runHealthLoop() {
    document.querySelectorAll("select").forEach(function(s) { sanitizeSelectOptions(s); bindSelectIntercept(s); });
    syncTwinCardHeading();
    syncMapTabOnly();
    updateStatusLabelsSafely();
    var modal = findAnalystModal();
    if (modal) purgeEmptyZeroDistrictBubbles(modal);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runHealthLoop);
  } else {
    runHealthLoop();
  }
  setInterval(runHealthLoop, 300);

  window.addEventListener("resize", function() {
    if (isCurrentlyMapOpen) {
      var mapEl = document.getElementById("map") || document.querySelector(".leaflet-container");
      if (mapEl) positionMapFlush(mapEl, true);
      var m = getMapInstance();
      if (m) m.invalidateSize({ animate: false });
    }
  });

  document.addEventListener("click", function(e) {
    setTimeout(runHealthLoop, 60);
    setTimeout(runHealthLoop, 220);

    var modal = findAnalystModal();
    if (!modal) return;
    var btn = e.target && e.target.closest("button");
    if (!btn || !modal.contains(btn)) return;

    var label = (btn.textContent || "").trim();
    if (label === "x" || label === "X" || label === "×" || label === "✕") return;

    var inp = modal.querySelector("input");
    if (label === "Ask") {
      e.preventDefault();
      e.stopImmediatePropagation();
      var val = inp ? inp.value : "";
      if (inp) inp.value = "";
      submitToAnalyst(modal, val);
      return;
    }

    if (["State Summary", "Critical Districts", "Best Water Quality", "Drought Action Plan"].indexOf(label) !== -1) {
      e.preventDefault();
      e.stopImmediatePropagation();
      submitToAnalyst(modal, label);
    }
  }, true);

  document.addEventListener("keydown", function(e) {
    if (e.key !== "Enter") return;
    var modal = findAnalystModal();
    if (!modal) return;
    var inp = modal.querySelector("input");
    if (inp && document.activeElement === inp) {
      e.preventDefault();
      e.stopImmediatePropagation();
      var val = inp.value;
      inp.value = "";
      submitToAnalyst(modal, val);
    }
  }, true);
})();
</script>

<script id="at-gw-js">
(function(){
  function normDist(s){
    return String(s || '').replace(/\s*(digital\s*twin|twin|district)\s*$/i, '').replace(/[^a-z0-9]+/gi, ' ').trim().toLowerCase();
  }

  function getActiveSelect(){
    var all = Array.prototype.slice.call(document.querySelectorAll('select'));
    var visible = all.filter(function(s){ return s.offsetParent !== null && s.options && s.options.length >= 10; });
    if (visible.length) return visible[visible.length - 1];
    var multi = all.filter(function(s){ return s.options && s.options.length >= 10; });
    return multi.length ? multi[multi.length - 1] : all[0];
  }

  function getSelectedRec(){
    var list = (window.AQUATWIN_ML_DATA && Array.isArray(window.AQUATWIN_ML_DATA.districts)) ? window.AQUATWIN_ML_DATA.districts : [];
    if (!list.length) return null;
    var sel = getActiveSelect();
    var name = 'Hyderabad';
    if (sel && sel.options && sel.selectedIndex >= 0) {
      name = sel.options[sel.selectedIndex].text || sel.value || 'Hyderabad';
    }
    var key = normDist(name);
    return list.find(function(x){ return normDist(x.district) === key; }) || list[0];
  }

  function badgeClass(status){
    var s = String(status || '').toLowerCase();
    if (s.indexOf('over') !== -1) return 'at-gw-over';
    if (s.indexOf('semi') !== -1) return 'at-gw-semi';
    if (s.indexOf('crit') !== -1) return 'at-gw-crit';
    return 'at-gw-safe';
  }

  function renderGroundwater(){
    var rec = getSelectedRec();
    if (!rec) return;
    var anchor = document.getElementById('at-extreme-box') || document.getElementById('at-ml-panel');
    if (!anchor || !anchor.parentNode) return;

    var card = document.getElementById('at-gw-card');
    if (!card) {
      card = document.createElement('div');
      card.id = 'at-gw-card';
      card.className = 'at-gw-card';
      anchor.parentNode.insertBefore(card, anchor.nextSibling);
    }

    var depth = Number(rec.gw_depth_mbgl || 8.24);
    var ext = Number(rec.gw_extraction_pct || 47.0);
    var rech = Number(rec.gw_recharge_mm || 8.5);
    var p1 = Number(rec.gw_pred_1m || depth);
    var p6 = Number(rec.gw_pred_6m || depth);
    var status = rec.gw_status || 'Safe';
    var syncTime = rec.last_satellite_sync || (window.AQUATWIN_ML_DATA && window.AQUATWIN_ML_DATA.last_satellite_sync) || 'Sentinel-2 Live';
    var stressPct = Math.max(8, Math.min(100, Math.round((depth / 18.0) * 100)));

    card.innerHTML =
      '<div class="at-gw-head">' +
        '<span>Groundwater Aquifer (' + rec.district + ')</span>' +
        '<span class="at-gw-badge ' + badgeClass(status) + '">' + status + '</span>' +
      '</div>' +
      '<div class="at-gw-sync"><span class="at-gw-dot"></span><span>GEE Sentinel-2 Synced: ' + syncTime + '</span></div>' +
      '<div class="at-gw-grid">' +
        '<div class="at-gw-cell"><span class="at-gw-lbl">Depth</span><b class="at-gw-val">' + depth.toFixed(2) + ' m</b></div>' +
        '<div class="at-gw-cell"><span class="at-gw-lbl">Extraction</span><b class="at-gw-val">' + ext.toFixed(1) + '%</b></div>' +
        '<div class="at-gw-cell"><span class="at-gw-lbl">Recharge</span><b class="at-gw-val">' + rech.toFixed(1) + ' mm</b></div>' +
      '</div>' +
      '<div class="at-gw-fc">' +
        '<div class="at-gw-cell"><span class="at-gw-lbl">ML Forecast +1M</span><b class="at-gw-val">' + p1.toFixed(2) + ' mbgl</b></div>' +
        '<div class="at-gw-cell"><span class="at-gw-lbl">ML Forecast +6M</span><b class="at-gw-val">' + p6.toFixed(2) + ' mbgl</b></div>' +
      '</div>' +
      '<div class="at-gw-bar-wrap">' +
        '<div class="at-gw-bar-lbl"><span>Aquifer Depth Stress</span><span>' + depth.toFixed(2) + ' / 18.0 mbgl</span></div>' +
        '<div class="at-gw-track"><div class="at-gw-fill" style="width:' + stressPct + '%"></div></div>' +
      '</div>';
  }

  function scheduleRender(){ setTimeout(renderGroundwater, 160); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(renderGroundwater, 700); });
  } else {
    setTimeout(renderGroundwater, 700);
  }
  document.addEventListener('change', scheduleRender);
  document.addEventListener('input', scheduleRender);
  document.addEventListener('click', scheduleRender);
})();
</script>

  border: 1px solid rgba(56, 189, 248, 0.28);
  display: flex;

}

.at-rt-list {
  margin-top: 10px;
  max-height: 310px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 3px;
}
.at-rt-row {
  padding: 9px 11px;
  border-radius: 12px;
  background: rgba(15, 31, 56, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.06);
  cursor: pointer;
  transition: border-color 0.25s ease, background 0.25s ease;
}
.at-rt-row.active {
  border-color: rgba(56, 189, 248, 0.70);
  background: rgba(14, 52, 88, 0.62);
}
.at-rt-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.at-rt-dname { font-size: 13px; font-weight: 700; color: #f1f5f9; }
.at-rt-pct { font-size: 13.5px; font-weight: 800; }
.at-rt-safe { color: #34d399; }
.at-rt-mod { color: #fbbf24; }
.at-rt-high { color: #f87171; }
.at-rt-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: #94a3b8; margin-top: 4px; }
.at-rt-bar { height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.09); margin-top: 6px; overflow: hidden; }
.at-rt-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
.at-rt-fill-safe { background: linear-gradient(90deg, #10b981, #38bdf8); }
.at-rt-fill-mod { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.at-rt-fill-high { background: linear-gradient(90deg, #ef4444, #fb923c); }

<script id="at-rt-js">
(function(){
  var isDemoOn = false;        // OFF by default — only runs when user turns Demo ON
  var selectedIdx = -1;        // -1 = State Average when Demo is OFF
  var activeIdx = 0;
  var liveList = [];
  var tickTimer = null;
  var clockTimer = null;
  var ringRefs = null;

  function loadDistricts(){
    var raw = (window.AQUATWIN_ML_DATA && Array.isArray(window.AQUATWIN_ML_DATA.districts)) ? window.AQUATWIN_ML_DATA.districts : [];
    liveList = raw.map(function(d){
      var baseWqi = Number(d.xgb_wqi != null ? d.xgb_wqi : (d.wqi_score != null ? d.wqi_score : 72));
      var baseWater = Number(d.water_coverage_pct != null ? d.water_coverage_pct : 1.2);
      var baseGw = Number(d.gw_extraction_pct != null ? d.gw_extraction_pct : 48.0);
      return {
        district: d.district || 'Unknown',
        baseWqi: baseWqi,
        curWqi: baseWqi,
        baseWater: baseWater,
        curWater: baseWater,
        baseGw: baseGw,
        curGw: baseGw,
        pred1m: Number(d.lstm_1m_wqi != null ? d.lstm_1m_wqi : baseWqi),
        sync: d.last_satellite_sync || (window.AQUATWIN_ML_DATA && window.AQUATWIN_ML_DATA.last_satellite_sync) || 'Sentinel-2 Live'
      };
    });
  }

  function stateAvgPct(){
    if (!liveList.length) return 75.0;
    var sum = liveList.reduce(function(acc, x){ return acc + x.curWqi; }, 0);
    return sum / liveList.length;
  }

  function colorForPct(pct){
    if (pct >= 70) return { stroke: '#38bdf8', grad: 'linear-gradient(90deg,#10b981,#38bdf8)', text: '#34d399' };
    if (pct >= 55) return { stroke: '#fbbf24', grad: 'linear-gradient(90deg,#f59e0b,#fbbf24)', text: '#fbbf24' };
    return { stroke: '#f87171', grad: 'linear-gradient(90deg,#ef4444,#fb923c)', text: '#f87171' };
  }

  function formatTime(){
    return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  }

  function findOverviewCard(){
    var nodes = document.querySelectorAll('h1, h2, h3, div, span');
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].children.length === 0 && /AquaTwin Overview/i.test(nodes[i].textContent || '')) {
        var box = nodes[i].parentElement;
        while (box && box.parentElement && box.parentElement.tagName !== 'BODY') {
          var st = window.getComputedStyle(box);
          if (parseFloat(st.borderRadius) >= 14 && box.offsetHeight >= 95 && box.offsetHeight <= 360) {
            return box;
          }
          box = box.parentElement;
        }
      }
    }
    return null;
  }

  function locateHealthRing(){
    if (ringRefs && document.body.contains(ringRefs.pctEl)) return ringRefs;
    var card = findOverviewCard();
    if (!card) return null;

    // Ensure card wraps cleanly so the bottom progress bar never squishes the header + ring
    if (window.getComputedStyle(card).display.indexOf('flex') !== -1) {
      card.style.flexWrap = 'wrap';
    }

    var all = card.querySelectorAll('*');
    var healthEl = null, pctEl = null;
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.closest && el.closest('#at-top-livebar')) continue;
      if (el.children.length === 0) {
        var t = (el.textContent || '').trim();
        if (/^HEALTH$/i.test(t) || el.dataset.atRingLabel === '1') healthEl = el;
        if (/^\d{1,3}(\.\d+)?%$/.test(t) || el.dataset.atRingPct === '1') pctEl = el;
      }
    }
    if (!pctEl) return null;
    pctEl.dataset.atRingPct = '1';
    if (healthEl) healthEl.dataset.atRingLabel = '1';

    var svgCircle = null;
    var conicEl = null;
    var cur = pctEl.parentElement;
    for (var depth = 0; depth < 5 && cur && cur !== card; depth++) {
      var circles = cur.querySelectorAll('circle');
      if (circles.length >= 2) {
        svgCircle = circles[circles.length - 1];
        break;
      }
      var bg = window.getComputedStyle(cur).backgroundImage || '';
      if (bg.indexOf('conic-gradient') !== -1) {
        conicEl = cur;
        break;
      }
      cur = cur.parentElement;
    }

    ringRefs = { card: card, pctEl: pctEl, healthEl: healthEl, svgCircle: svgCircle, conicEl: conicEl };
    return ringRefs;
  }

  function setDemoRunning(nextState){
    isDemoOn = Boolean(nextState);
    var btn = document.getElementById('at-demo-toggle');
    if (btn) {
      btn.classList.toggle('on', isDemoOn);
      var lbl = document.getElementById('at-demo-txt');
      if (lbl) lbl.textContent = isDemoOn ? 'Demo: ON' : 'Demo: OFF';
    }

    if (isDemoOn) {
      if (selectedIdx >= 0) activeIdx = selectedIdx;
      startTimers();
      stepRealTime(false);
    } else {
      stopTimers();
      selectedIdx = -1;
      // Reset to exact synced base values when Demo turns OFF
      liveList.forEach(function(d){
        d.curWqi = d.baseWqi;
        d.curWater = d.baseWater;
        d.curGw = d.baseGw;
      });
      updateOverviewRingAndBar();
      renderPanel();
    }
  }

  function bindDemoButton(){
    if (document.getElementById('at-demo-toggle')) return;
    var card = findOverviewCard() || document.body;
    var candidates = card.querySelectorAll('button, [role="button"], span, div');
    var target = null;

    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];
      var txt = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (/^demo\s*:\s*(off|on)$/i.test(txt)) {
        if (!target || el.tagName === 'BUTTON' || el.children.length < target.children.length) {
          target = el;
          if (el.tagName === 'BUTTON') break;
        }
      }
    }

    if (!target || !target.parentNode) return;
    var btn = document.createElement('button');
    btn.id = 'at-demo-toggle';
    btn.type = 'button';
    btn.className = 'at-demo-btn' + (isDemoOn ? ' on' : '');
    btn.innerHTML = '<span class="at-demo-dot"></span><span id="at-demo-txt">' + (isDemoOn ? 'Demo: ON' : 'Demo: OFF') + '</span>';
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      setDemoRunning(!isDemoOn);
    }, true);
    target.parentNode.replaceChild(btn, target);
  }

  function updateOverviewRingAndBar(){
    if (!liveList.length) return;
    var refs = locateHealthRing();
    if (!refs) return;

    var pct, ringLabel, barLeft;
    if (isDemoOn || selectedIdx >= 0) {
      var idx = isDemoOn ? (activeIdx % liveList.length) : (selectedIdx % liveList.length);
      var active = liveList[idx];
      pct = Math.max(5, Math.min(99.9, active.curWqi));
      ringLabel = active.district.length > 10 ? active.district.slice(0, 9) + '.' : active.district;
      barLeft = (isDemoOn ? '▶ Live ' : '● ') + (idx + 1) + '/' + liveList.length + ' • <b>' + active.district + '</b>';
    } else {
      pct = Math.max(5, Math.min(99.9, stateAvgPct()));
      ringLabel = 'HEALTH';
      barLeft = 'Telangana Avg (33 Districts) • Tap <b>Demo: OFF</b> to play live';
    }

    var pal = colorForPct(pct);
    refs.pctEl.textContent = pct.toFixed(1) + '%';
    refs.pctEl.style.color = pal.text;
    if (refs.healthEl) {
      refs.healthEl.textContent = ringLabel.toUpperCase();
      refs.healthEl.style.fontSize = ringLabel === 'HEALTH' ? '' : '9px';
    }

    if (refs.svgCircle) {
      var r = parseFloat(refs.svgCircle.getAttribute('r')) || 36;
      var circ = 2 * Math.PI * r;
      refs.svgCircle.style.transition = 'stroke-dashoffset 0.5s ease, stroke 0.35s ease';
      refs.svgCircle.setAttribute('stroke-dasharray', circ.toFixed(2));
      refs.svgCircle.setAttribute('stroke-dashoffset', (circ * (1 - pct / 100)).toFixed(2));
      refs.svgCircle.setAttribute('stroke', pal.stroke);
    } else if (refs.conicEl) {
      refs.conicEl.style.background = 'conic-gradient(' + pal.stroke + ' ' + pct.toFixed(1) + '%, rgba(255,255,255,0.12) ' + pct.toFixed(1) + '% 100%)';
    }

    var barWrap = document.getElementById('at-top-livebar');
    if (!barWrap) {
      barWrap = document.createElement('div');
      barWrap.id = 'at-top-livebar';
      barWrap.className = 'at-top-livebar';
      refs.card.appendChild(barWrap);
    }
    barWrap.innerHTML =
      '<div class="at-top-livebar-head">' +
        '<span>' + barLeft + '</span>' +
        '<b style="color:' + pal.text + ';white-space:nowrap">' + pct.toFixed(1) + '%</b>' +
      '</div>' +
      '<div class="at-top-livebar-track">' +
        '<div class="at-top-livebar-fill" style="width:' + pct.toFixed(1) + '%;background:' + pal.grad + '"></div>' +
      '</div>';

    // Update Water Stress Distribution % shares
    var total = liveList.length;
    var normCnt = liveList.filter(function(x){ return x.curWqi >= 70; }).length;
    var modCnt = liveList.filter(function(x){ return x.curWqi >= 55 && x.curWqi < 70; }).length;
    var lowCnt = total - normCnt - modCnt;
    var spans = document.querySelectorAll('span, div');
    for (var i = 0; i < spans.length; i++) {
      var el = spans[i];
      if (el.children.length !== 0) continue;
      var txt = (el.textContent || '').trim();
      if (/^Normal:\s*\d+/i.test(txt)) el.textContent = 'Normal: ' + normCnt + ' (' + Math.round((normCnt / total) * 100) + '%)';
      else if (/^High Turbidity:\s*\d+/i.test(txt)) el.textContent = 'High Turbidity: ' + modCnt + ' (' + Math.round((modCnt / total) * 100) + '%)';
      else if (/^Low Water:\s*\d+/i.test(txt)) el.textContent = 'Low Water: ' + lowCnt + ' (' + Math.round((lowCnt / total) * 100) + '%)';
    }
  }

  function updateSyncClock(){
    var nodes = document.querySelectorAll('div, p, span');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.children.length === 0 && /Live (Digital Twin|GEE Satellite) Sync/i.test(el.textContent)) {
        el.textContent = (isDemoOn ? 'Live Real-Time Stream - ' : 'GEE Satellite Synced - ') + formatTime();
        break;
      }
    }
  }

  function findHomeAnchor(){
    var nodes = document.querySelectorAll('h2, h3, div, span');
    for (var i = 0; i < nodes.length; i++) {
      var txt = (nodes[i].textContent || '').trim();
      if (nodes[i].children.length === 0 && txt === 'Priority Watchlist') {
        var box = nodes[i].parentElement;
        while (box && box.parentElement && box.parentElement.tagName !== 'BODY') {
          var st = window.getComputedStyle(box);
          if (parseFloat(st.borderRadius) >= 12 || (st.backgroundColor && st.backgroundColor !== 'rgba(0, 0, 0, 0)')) {
            return box;
          }
          box = box.parentElement;
        }
        return nodes[i].parentElement;
      }
    }
    return null;
  }

  function renderPanel(){
    if (!liveList.length) return;
    var anchor = findHomeAnchor();
    if (!anchor || !anchor.parentNode) return;

    var panel = document.getElementById('at-rt-panel');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'at-rt-panel';
      panel.className = 'at-rt-panel';
      anchor.parentNode.insertBefore(panel, anchor.nextSibling);
    }

    var avgPct = stateAvgPct();
    var highlightIdx = isDemoOn ? (activeIdx % liveList.length) : selectedIdx;
    var cur = highlightIdx >= 0 ? liveList[highlightIdx] : null;

    var rowsHtml = liveList.map(function(d, idx){
      var pct = Math.max(5, Math.min(100, d.curWqi));
      var cls = pct >= 70 ? 'at-rt-safe' : (pct >= 55 ? 'at-rt-mod' : 'at-rt-high');
      var fCls = pct >= 70 ? 'at-rt-fill-safe' : (pct >= 55 ? 'at-rt-fill-mod' : 'at-rt-fill-high');
      var isAct = (idx === highlightIdx);
      return (
        '<div class="at-rt-row' + (isAct ? ' active' : '') + '" data-rt-idx="' + idx + '">' +
          '<div class="at-rt-row-head">' +
            '<span class="at-rt-dname">' + (idx + 1) + '. ' + d.district + '</span>' +
            '<span class="at-rt-pct ' + cls + '">' + pct.toFixed(1) + '%</span>' +
          '</div>' +
          '<div class="at-rt-meta">' +
            '<span>Water: ' + d.curWater.toFixed(2) + '%</span>' +
            '<span>GW Use: ' + d.curGw.toFixed(1) + '%</span>' +
            '<span>+1M: ' + d.pred1m.toFixed(1) + '%</span>' +
          '</div>' +
          '<div class="at-rt-bar"><div class="at-rt-fill ' + fCls + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
        '</div>'
      );
    }).join('');

    var tickerLeft = isDemoOn && cur
      ? '▶ Playing Live: <b>' + cur.district + '</b>'
      : (cur ? '● Selected: <b>' + cur.district + '</b>' : '❚❚ Demo OFF • State Overview');
    var tickerRight = cur
      ? '<b>' + cur.curWqi.toFixed(1) + '%</b> Health'
      : '<b>' + avgPct.toFixed(1) + '%</b> Avg';

    panel.innerHTML =
      '<div class="at-rt-title">Real-Time District Health (%)</div>' +
      '<div class="at-rt-sub">All ' + liveList.length + ' Districts • State Avg: ' + avgPct.toFixed(1) + '% • ' + (isDemoOn ? 'Live Demo Running' : 'Turn Demo ON to auto-play') + '</div>' +
      '<div class="at-rt-ticker">' +
        '<span>' + tickerLeft + '</span>' +
        '<span>' + tickerRight + '</span>' +
      '</div>' +
      '<div class="at-rt-list">' + rowsHtml + '</div>';

    var rows = panel.querySelectorAll('.at-rt-row');
    for (var r = 0; r < rows.length; r++) {
      rows[r].addEventListener('click', function(){
        var clicked = Number(this.getAttribute('data-rt-idx')) || 0;
        selectedIdx = clicked;
        activeIdx = clicked;
        updateOverviewRingAndBar();
        renderPanel();
      });
    }
  }

  function stepRealTime(advance){
    if (!isDemoOn || !liveList.length) return;
    if (advance !== false) activeIdx = (activeIdx + 1) % liveList.length;
    liveList.forEach(function(d, i){
      var drift = (Math.sin(Date.now() / 4000 + i) * 0.25);
      d.curWqi = Math.max(15, Math.min(99, d.baseWqi + drift));
      d.curWater = Math.max(0.05, d.baseWater + drift * 0.02);
      d.curGw = Math.max(10, Math.min(115, d.baseGw + drift * 0.15));
    });
    updateOverviewRingAndBar();
    renderPanel();
  }

  function startTimers(){
    if (!tickTimer) tickTimer = setInterval(function(){ stepRealTime(true); }, 2500);
    if (!clockTimer) clockTimer = setInterval(updateSyncClock, 1000);
    updateSyncClock();
  }

  function stopTimers(){
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    updateSyncClock();
  }

  function boot(){
    loadDistricts();
    bindDemoButton();
    updateOverviewRingAndBar();
    renderPanel();
    updateSyncClock();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 500); });
  } else {
    setTimeout(boot, 500);
  }
  document.addEventListener('click', function(e){
    if (e.target && e.target.closest && e.target.closest('#at-demo-toggle')) return;
    setTimeout(function(){
      bindDemoButton();
      updateOverviewRingAndBar();
      renderPanel();
    }, 250);
  });
})();
</script>
