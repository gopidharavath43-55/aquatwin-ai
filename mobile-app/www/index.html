  padding: 0 16px;
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  color: #ffffff;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
}
</style>
<script id="at-askai-js">
(function(){
  if (window.__AT_ASKAI_V5__) return;
  window.__AT_ASKAI_V5__ = true;

  var openedAt = 0;

  function esc(s){
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function norm(s){
    return String(s || '')
      .replace(/\s*(digital\s*twin|twin|district)\s*$/i, '')
      .replace(/[^a-z0-9]+/gi, ' ')
      .trim()
      .toLowerCase();
  }

  function num(v, fb){
    var n = Number(v);
    return isFinite(n) ? n : fb;
  }

  function getDistricts(){
    var d = window.AQUATWIN_ML_DATA;
    return (d && Array.isArray(d.districts)) ? d.districts : [];
  }

  function getSyncStamp(){
    var d = window.AQUATWIN_ML_DATA;
    return (d && d.last_satellite_sync) ? d.last_satellite_sync : 'Sentinel-2 Live';
  }

  function getActiveDistrictName(){
    var sels = Array.prototype.slice.call(document.querySelectorAll('select'));
    var vis = sels.filter(function(s){ return s.offsetParent !== null && s.options && s.options.length >= 10; });
    var sel = vis.length ? vis[vis.length - 1] : sels.find(function(s){ return s.options && s.options.length >= 10; });
    if (sel && sel.options && sel.selectedIndex >= 0) {
      return (sel.options[sel.selectedIndex].text || sel.value || 'Hyderabad').trim();
    }
    return 'Hyderabad';
  }

  // Exact + alias + typo-tolerant matcher for all 33 Telangana districts
  function findDistrict(text, list){
    var q = norm(text);
    if (!q || !list.length) return null;

    var aliases = {
      hyd: 'hyderabad', hyderbad: 'hyderabad', hyderabd: 'hyderabad',
      wgl: 'warangal', kmm: 'khammam', nzb: 'nizamabad', krm: 'karimnagar',
      mbnr: 'mahabubnagar', nlg: 'nalgonda', rr: 'Ranga Reddy', ranga: 'Ranga Reddy',
      hanamkonda: 'hanumakonda', hanumakonda: 'hanumakonda',
      komaram: 'kumuram bheem asifabad', asifabad: 'kumuram bheem asifabad',
      kothagudem: 'bhadradri kothagudem', bhadradri: 'bhadradri kothagudem',
      sircilla: 'rajanna sircilla', bhuvanagiri: 'yadadri bhuvanagiri', yadadri: 'yadadri bhuvanagiri',
      gadwal: 'jogulamba gadwal', bhupalpally: 'jayashankar bhupalpally', malkajgiri: 'Medchal-Malkajgiri',
      medchal: 'Medchal-Malkajgiri', peddapalle: 'peddapalli', sanga: 'sangareddy'
    };

    var expanded = q;
    var toks = q.split(' ');
    for (var t = 0; t < toks.length; t++) {
      if (aliases[toks[t]]) expanded += ' ' + aliases[toks[t]];
    }

    // 1. Exact or contained full district name
    for (var i = 0; i < list.length; i++) {
      var dn = norm(list[i].district);
      if (dn && (expanded === dn || expanded.indexOf(dn) !== -1 || (q.length >= 4 && dn.indexOf(q) !== -1))) {
        return list[i];
      }
    }

    // 2. Any significant word match (4+ chars)
    for (var j = 0; j < list.length; j++) {
      var parts = norm(list[j].district).split(' ');
      for (var p = 0; p < parts.length; p++) {
        if (parts[p].length >= 4 && expanded.indexOf(parts[p]) !== -1) return list[j];
      }
    }

    // 3. Prefix match for minor typos (first 4 letters)
    for (var k = 0; k < toks.length; k++) {
      if (toks[k].length < 4) continue;
      var pref = toks[k].slice(0, 4);
      for (var m = 0; m < list.length; m++) {
        if (norm(list[m].district).indexOf(pref) === 0) return list[m];
      }
    }
    return null;
  }

  // Clear WHY explanation for Safe / Medium (Moderate Risk) / High Risk
  function buildWhyReason(d, liveW){
    var wqi = num(d.xgb_wqi != null ? d.xgb_wqi : d.wqi_score, 72);
    var turb = num(d.turbidity_index, 1.05);
    var wc = num(d.water_coverage_pct, 1.2);
    var gwd = num(d.gw_depth_mbgl, 8.24);
    var gwe = num(d.gw_extraction_pct, 48);
    var st = d.gw_status || 'Safe';

    var tier = wqi >= 70 ? 'SAFE' : (wqi >= 55 ? 'MEDIUM (MODERATE RISK)' : 'HIGH RISK');
    var reasons = [];

    if (wqi >= 70) {
      reasons.push('WQI is ' + wqi.toFixed(1) + '/100 (above the 70 Safe threshold)');
    } else if (wqi >= 55) {
      reasons.push('WQI is ' + wqi.toFixed(1) + '/100 (in the 55–69.9 Moderate watch zone)');
    } else {
      reasons.push('WQI dropped to ' + wqi.toFixed(1) + '/100 (below the 55 High-Risk threshold)');
    }

    if (turb >= 1.20) reasons.push('High satellite turbidity (' + turb.toFixed(2) + ' >= 1.20 indicates elevated silt/suspended particles)');
    else if (turb >= 1.05) reasons.push('Moderate turbidity (' + turb.toFixed(2) + ') needs routine filtration');
    else reasons.push('Low turbidity (' + turb.toFixed(2) + ') shows clear surface water');

    if (wc < 0.8) reasons.push('Low surface water spread (' + wc.toFixed(2) + '% < 0.8%)');
    else reasons.push('Adequate surface water cover (' + wc.toFixed(2) + '%)');

    if (st === 'Over-Exploited' || st === 'Critical' || gwd >= 11.5 || gwe >= 85) {
      reasons.push('Groundwater is stressed at ' + gwd.toFixed(2) + ' mbgl (' + st + ', ' + gwe.toFixed(1) + '% extraction)');
    } else if (st === 'Semi-Critical' || gwd >= 9.0) {
      reasons.push('Groundwater is Semi-Critical (' + gwd.toFixed(2) + ' mbgl, ' + gwe.toFixed(1) + '% extraction)');
    } else {
      reasons.push('Groundwater aquifer is stable (' + gwd.toFixed(2) + ' mbgl, ' + gwe.toFixed(1) + '% extraction)');
    }

    if (liveW && liveW.temp != null) {
      if (liveW.rain > 0) reasons.push('Live mobile weather shows ' + liveW.rain.toFixed(1) + ' mm rain aiding recharge');
      else if (liveW.temp >= 34) reasons.push('Live heat (' + liveW.temp.toFixed(1) + '°C) increases surface evaporation');
    }

    return 'WHY ' + tier + ':\n• ' + reasons.join('\n• ');
  }

  // Fetch real-time weather directly from the mobile app via Open-Meteo (free, no PC needed)
  function fetchMobileLiveWeather(lat, lon){
    if (!isFinite(lat) || !isFinite(lon)) return Promise.resolve(null);
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(4) +
              '&longitude=' + lon.toFixed(4) +
              '&current=temperature_2m,relative_humidity_2m,precipitation,cloud_cover' +
              '&daily=precipitation_sum,et0_fao_evapotranspiration&forecast_days=1&timezone=Asia%2FKolkata';
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 3500) : null;
    return fetch(url, ctrl ? { signal: ctrl.signal } : {})
      .then(function(r){ if (timer) clearTimeout(timer); return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j || !j.current) return null;
        return {
          temp: num(j.current.temperature_2m, null),
          hum: num(j.current.relative_humidity_2m, null),
          rain: num(j.current.precipitation, 0),
          cloud: num(j.current.cloud_cover, 0),
          et0: (j.daily && j.daily.et0_fao_evapotranspiration) ? num(j.daily.et0_fao_evapotranspiration[0], null) : null,
          time: j.current.time || 'Now'
        };
      })
      .catch(function(){ if (timer) clearTimeout(timer); return null; });
  }

  function formatDistrict(d, liveW){
    var wqi = num(d.xgb_wqi != null ? d.xgb_wqi : d.wqi_score, 72);
    var p1 = num(d.lstm_1m_wqi, wqi);
    var p3 = num(d.lstm_3m_wqi, (p1 + num(d.lstm_6m_wqi, p1)) / 2);
    var p6 = num(d.lstm_6m_wqi, p1);
    var ndwi = num(d.ndwi_mean, 0.04);
    var ndmi = num(d.ndmi_proxy, 0.08);
    var turb = num(d.turbidity_index, 1.05);
    var wc = num(d.water_coverage_pct, 1.2);
    var gwd = num(d.gw_depth_mbgl, 8.24);
    var gwe = num(d.gw_extraction_pct, 48);
    var gwr = num(d.gw_recharge_mm, 8.5);
    var gw1 = num(d.gw_pred_1m, gwd);
    var gw6 = num(d.gw_pred_6m, gwd);
    var st = d.gw_status || 'Safe';
    var risk = wqi >= 70 ? 'Safe' : (wqi >= 55 ? 'Moderate Risk' : 'High Risk');

    var liveBlock = liveW
      ? '[1] LIVE ON-PHONE TELEMETRY (Now)\n' +
        '• Temp: ' + liveW.temp.toFixed(1) + '°C | Humidity: ' + liveW.hum.toFixed(0) + '% | Cloud: ' + liveW.cloud.toFixed(0) + '%\n' +
        '• Live Rain: ' + liveW.rain.toFixed(1) + ' mm' + (liveW.et0 != null ? ' | Evap (ET0): ' + liveW.et0.toFixed(1) + ' mm/day' : '') + '\n\n'
      : '[1] ON-PHONE DATA (Offline Mode)\n• Using latest synced Sentinel-2 & climate cache\n\n';

    return (
      d.district + ' — Live Digital Twin (' + (d.last_satellite_sync || getSyncStamp()) + ')\n\n' +
      liveBlock +
      '[2] SATELLITE & WATER QUALITY (Sentinel-2)\n' +
      '• Live WQI: ' + wqi.toFixed(1) + '/100 (' + risk + ')\n' +
      '• Forecast: +1M ' + p1.toFixed(1) + ' | +3M ' + p3.toFixed(1) + ' | +6M ' + p6.toFixed(1) + '\n' +
      '• NDWI: ' + ndwi.toFixed(4) + ' | Turbidity: ' + turb.toFixed(4) + ' | Water Cover: ' + wc.toFixed(2) + '%\n\n' +
      '[3] GROUNDWATER AQUIFER\n' +
      '• Depth: ' + gwd.toFixed(2) + ' mbgl (' + st + ') | Extraction: ' + gwe.toFixed(1) + '%\n' +
      '• Recharge: ' + gwr.toFixed(1) + ' mm | GW Forecast: +1M ' + gw1.toFixed(2) + ' m, +6M ' + gw6.toFixed(2) + ' m\n\n' +
      buildWhyReason(d, liveW)
    );
  }

  function answerQueryAsync(question){
    var list = getDistricts();
    if (!list.length) return Promise.resolve({ text: 'Dataset not loaded yet. Please restart the app.', searchQuery: question });
    var q = norm(question);

    // Compare two districts
    if (q.indexOf('compare') !== -1 || q.indexOf(' vs ') !== -1) {
      var hits = [];
      for (var i = 0; i < list.length; i++) {
        var dn = norm(list[i].district);
        if (dn && q.indexOf(dn) !== -1) hits.push(list[i]);
      }
      if (hits.length >= 2) {
        var a = hits[0], b = hits[1];
        return Promise.resolve({
          text: 'Live Comparison:\n' +
            '1) ' + a.district + ': WQI ' + num(a.xgb_wqi,70).toFixed(1) + ' (' + (num(a.xgb_wqi,70)>=70?'Safe':num(a.xgb_wqi,70)>=55?'Medium':'High Risk') + ') | Water ' + num(a.water_coverage_pct,1).toFixed(2) + '% | GW ' + num(a.gw_depth_mbgl,8).toFixed(2) + 'm (' + (a.gw_status||'Safe') + ')\n' +
            '2) ' + b.district + ': WQI ' + num(b.xgb_wqi,70).toFixed(1) + ' (' + (num(b.xgb_wqi,70)>=70?'Safe':num(b.xgb_wqi,70)>=55?'Medium':'High Risk') + ') | Water ' + num(b.water_coverage_pct,1).toFixed(2) + '% | GW ' + num(b.gw_depth_mbgl,8).toFixed(2) + 'm (' + (b.gw_status||'Safe') + ')',
          searchQuery: a.district + ' vs ' + b.district + ' Telangana water quality'
        });
      }
    }

    // Specific district requested (with live mobile Open-Meteo fetch!)
    var found = findDistrict(question, list);
    if (found) {
      return fetchMobileLiveWeather(num(found.latitude, 17.385), num(found.longitude, 78.4867)).then(function(liveW){
        return {
          text: formatDistrict(found, liveW),
          searchQuery: found.district + ' Telangana water quality groundwater latest'
        };
      });
    }

    if (q.indexOf('satellite') !== -1 || q.indexOf('sentinel') !== -1 || q.indexOf('ndwi') !== -1 || q.indexOf('turbid') !== -1) {
      var topW = list.slice().sort(function(a,b){ return num(b.water_coverage_pct,0) - num(a.water_coverage_pct,0); }).slice(0,4);
      var hiT = list.slice().sort(function(a,b){ return num(b.turbidity_index,0) - num(a.turbidity_index,0); }).slice(0,4);
      return Promise.resolve({
        text: 'Live Sentinel-2 Satellite Telemetry (' + getSyncStamp() + ')\n\n' +
          'Highest Water Coverage:\n' +
          topW.map(function(d,i){ return (i+1)+'. '+d.district+': '+num(d.water_coverage_pct,0).toFixed(2)+'% (NDWI '+num(d.ndwi_mean,0).toFixed(3)+')'; }).join('\n') + '\n\n' +
          'Highest Turbidity (Why Medium/High Risk):\n' +
          hiT.map(function(d,i){ return (i+1)+'. '+d.district+': Turb '+num(d.turbidity_index,1).toFixed(3)+' -> WQI '+num(d.xgb_wqi,70).toFixed(1); }).join('\n'),
        searchQuery: 'Telangana Sentinel 2 reservoir water level latest'
      });
    }

    if (q.indexOf('groundwater') !== -1 || q.indexOf('ground water') !== -1 || q.indexOf('aquifer') !== -1 || q.indexOf('depth') !== -1 || q.indexOf('critical') !== -1 || q.indexOf('gw') !== -1) {
      var deep = list.slice().sort(function(a,b){ return num(b.gw_depth_mbgl,0) - num(a.gw_depth_mbgl,0); }).slice(0,5);
      var avgGw = (list.reduce(function(s,x){ return s + num(x.gw_depth_mbgl,8.2); }, 0) / list.length).toFixed(2);
      return Promise.resolve({
        text: 'Telangana Live Groundwater (Avg: ' + avgGw + ' mbgl)\n\nMost Stressed / Deepest (Why Critical/Over-Exploited):\n' +
          deep.map(function(d,i){ return (i+1)+'. '+d.district+' — '+num(d.gw_depth_mbgl,8).toFixed(2)+' mbgl ('+(d.gw_status||'Safe')+', Ext '+num(d.gw_extraction_pct,45).toFixed(1)+'%)'; }).join('\n'),
        searchQuery: 'Telangana groundwater level latest report'
      });
    }

    if (q.indexOf('risk') !== -1 || q.indexOf('worst') !== -1 || q.indexOf('low') !== -1 || q.indexOf('watchlist') !== -1 || q.indexOf('medium') !== -1) {
      var worst = list.slice().sort(function(a,b){ return num(a.xgb_wqi,99) - num(b.xgb_wqi,99); }).slice(0,5);
      return Promise.resolve({
        text: 'Top 5 Priority Watchlist Districts & Why:\n' +
          worst.map(function(d,i){
            return (i+1)+'. '+d.district+' — WQI '+num(d.xgb_wqi,60).toFixed(1)+' (Turb '+num(d.turbidity_index,1).toFixed(2)+', Water '+num(d.water_coverage_pct,1).toFixed(2)+'%, GW '+num(d.gw_depth_mbgl,8).toFixed(1)+'m)';
          }).join('\n'),
        searchQuery: 'Telangana water stress high risk districts latest'
      });
    }

    if (q.indexOf('telangana') !== -1 || q.indexOf('state') !== -1 || q.indexOf('summary') !== -1 || q.indexOf('all') !== -1) {
      var avgWqi = (list.reduce(function(s,x){ return s + num(x.xgb_wqi,70); }, 0) / list.length).toFixed(1);
      var avgWc = (list.reduce(function(s,x){ return s + num(x.water_coverage_pct,1); }, 0) / list.length).toFixed(2);
      var avgGw = (list.reduce(function(s,x){ return s + num(x.gw_depth_mbgl,8.2); }, 0) / list.length).toFixed(2);
      var safeCnt = list.filter(function(x){ return num(x.xgb_wqi,70) >= 70; }).length;
      var medCnt = list.filter(function(x){ return num(x.xgb_wqi,70) >= 55 && num(x.xgb_wqi,70) < 70; }).length;
      var highCnt = list.length - safeCnt - medCnt;
      return Promise.resolve({
        text: 'Telangana Live Summary (33 Districts)\n' +
          '• Sync: ' + getSyncStamp() + '\n' +
          '• Avg WQI: ' + avgWqi + '/100\n' +
          '• Breakdown: ' + safeCnt + ' Safe | ' + medCnt + ' Medium | ' + highCnt + ' High Risk\n' +
          '• Avg Surface Water: ' + avgWc + '% | Avg GW Depth: ' + avgGw + ' mbgl',
        searchQuery: 'Telangana water resources reservoirs groundwater latest'
      });
    }

    // Current district fallback
    var cur = findDistrict(getActiveDistrictName(), list) || list[0];
    return fetchMobileLiveWeather(num(cur.latitude, 17.385), num(cur.longitude, 78.4867)).then(function(liveW){
      return {
        text: formatDistrict(cur, liveW),
        searchQuery: cur.district + ' Telangana water quality groundwater latest'
      };
    });
  }

  function ensureModal(){
    if (document.getElementById('at-askai-bg')) return;
    var bg = document.createElement('div');
    bg.id = 'at-askai-bg';
    bg.innerHTML =
      '<div class="at-ai-sheet">' +
        '<div class="at-ai-head">' +
          '<div><div class="at-ai-title">AquaTwin Ask AI</div><div class="at-ai-sub">Live Mobile Weather • Satellite • Groundwater • Why Risk</div></div>' +
          '<button type="button" class="at-ai-close" id="at-ai-close">Close</button>' +
        '</div>' +
        '<div class="at-ai-live"><span class="at-ai-dot"></span><span id="at-ai-status">Loading live data...</span></div>' +
        '<div class="at-ai-chips" id="at-ai-chips">' +
          '<button type="button" class="at-ai-chip" data-q="Hyderabad">Hyderabad</button>' +
          '<button type="button" class="at-ai-chip" data-q="Current district report">Current District</button>' +
          '<button type="button" class="at-ai-chip" data-q="Real time satellite data">Satellite Data</button>' +
          '<button type="button" class="at-ai-chip" data-q="Groundwater status">Groundwater</button>' +
          '<button type="button" class="at-ai-chip" data-q="High risk districts">Why High Risk</button>' +
          '<button type="button" class="at-ai-chip" data-q="Telangana state summary">State Summary</button>' +
        '</div>' +
        '<div class="at-ai-msgs" id="at-ai-msgs">' +
          '<div class="at-ai-msg ai">Type any of Telangana\'s 33 districts (e.g., Hyderabad, Warangal, Khammam, Jangaon) for live mobile weather, Sentinel-2 water quality, groundwater depth, and WHY it is Safe, Medium, or High Risk.</div>' +
        '</div>' +
        '<div class="at-ai-bar">' +
          '<input type="text" class="at-ai-input" id="at-ai-input" placeholder="Ask Hyderabad, Warangal, why risk, groundwater..." />' +
          '<button type="button" class="at-ai-send" id="at-ai-send">Send</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bg);

    function send(text){
      var msg = String(text || '').trim();
      if (!msg) return;
      var box = document.getElementById('at-ai-msgs');
      var u = document.createElement('div');
      u.className = 'at-ai-msg user';
      u.textContent = msg;
      box.appendChild(u);

      var a = document.createElement('div');
      a.className = 'at-ai-msg ai';
      a.textContent = 'Fetching live mobile data...';
      box.appendChild(a);
      box.scrollTop = box.scrollHeight;

      answerQueryAsync(msg).then(function(res){
        var gUrl = 'https://www.google.com/search?q=' + encodeURIComponent(res.searchQuery || (msg + ' Telangana water'));
        a.innerHTML = esc(res.text) + '<br><a class="at-web-link" href="' + gUrl + '" target="_blank" rel="noopener">Search Google Live ↗</a>';
        box.scrollTop = box.scrollHeight;
      });
    }

    bg.addEventListener('click', function(e){
      if (e.target === bg && (Date.now() - openedAt > 600)) bg.classList.remove('open');
    });
    document.getElementById('at-ai-close').addEventListener('click', function(){ bg.classList.remove('open'); });
    document.getElementById('at-ai-send').addEventListener('click', function(){
      var inp = document.getElementById('at-ai-input');
      send(inp.value);
      inp.value = '';
    });
    document.getElementById('at-ai-input').addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); send(this.value); this.value = ''; }
    });
    document.getElementById('at-ai-chips').addEventListener('click', function(e){
      var c = e.target.closest('.at-ai-chip');
      if (c) send(c.getAttribute('data-q'));
    });
  }

  function openAskAi(){
    ensureModal();
    openedAt = Date.now();
    var list = getDistricts();
    var st = document.getElementById('at-ai-status');
    if (st) st.textContent = list.length + ' Districts Live • Mobile Open-Meteo + Sentinel-2 + GW';
    document.getElementById('at-askai-bg').classList.add('open');
  }

  function hideLegacyAndMountFab(){
    var els = document.querySelectorAll('button, [role="button"], div, a');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.id === 'at-askai-fab' || (el.closest && el.closest('#at-askai-bg'))) continue;
      var txt = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (txt.length <= 24 && /ask\s*ai/i.test(txt)) {
        var r = el.getBoundingClientRect();
        if (r.width > 35 && r.width < 260 && r.height > 24 && r.height < 110 && r.bottom > window.innerHeight * 0.55) {
          el.style.setProperty('display', 'none', 'important');
          el.style.setProperty('pointer-events', 'none', 'important');
        }
      }
    }

    if (!document.getElementById('at-askai-fab')) {
      var fab = document.createElement('button');
      fab.id = 'at-askai-fab';
      fab.type = 'button';
      fab.innerHTML = '<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18h6m-5 3h4M12 3a7 7 0 0 0-4 12.7c.7.6 1 1.3 1 2.3h6c0-1 .3-1.7 1-2.3A7 7 0 0 0 12 3z"/></svg><span>Ask AI</span>';
      fab.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        openAskAi();
      });
      document.body.appendChild(fab);
    }
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || (t.closest && t.closest('#at-askai-bg'))) return;
    var btn = t.closest ? (t.closest('#at-askai-fab') || t.closest('button, [role="button"]')) : t;
    if (!btn) return;
    var txt = (btn.textContent || '').replace(/\s+/g, ' ').trim();
    if (btn.id === 'at-askai-fab' || (txt.length <= 24 && /ask\s*ai/i.test(txt))) {
      e.preventDefault();
      e.stopImmediatePropagation();
      openAskAi();
    }
  }, true);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(hideLegacyAndMountFab, 250); });
  } else {
    setTimeout(hideLegacyAndMountFab, 250);
  }

<script id="at-top-hist-js">
(function(){

  }

  function stamp(){
    var d = new Date();
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ', ' +
           d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  }

  function load(){
    try {
      var a = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(a) ? a : [];
    } catch(e){ return []; }
  }

  function updateBadgeText(cnt){
    var b = document.getElementById('at-h-badge');
    if (b && b.textContent !== String(cnt)) b.textContent = String(cnt);
  }

  function save(arr){
    var trimmed = arr.slice(0, 100);
    try { localStorage.setItem(KEY, JSON.stringify(trimmed)); } catch(e){}
    updateBadgeText(trimmed.length);
  }

  function autoSaveQa(q, a){
    if (isSaving) return;
    var cleanQ = String(q || '').trim();
    var cleanA = String(a || '').replace(/\s*Search Google Live\s*↗?\s*$/i, '').trim();
    if (!cleanQ || !cleanA || /fetching live mobile data/i.test(cleanA)) return;
    var sig = cleanQ + '::' + cleanA.slice(0, 140);
    if (sig === lastSavedSig) return;

    isSaving = true;
    lastSavedSig = sig;
    var arr = load();
    arr.unshift({
      id: Date.now() + '_' + Math.floor(Math.random() * 9999),
      q: cleanQ,
      a: cleanA,
      t: stamp()

    save(arr);
    var bg = document.getElementById('at-hist-bg');
    if (bg && bg.classList.contains('open')) renderList();
    isSaving = false;
  }

  function hideOldTopIcons(){
    var hb = document.getElementById('at-history-btn');
    var iconBtns = Array.prototype.slice.call(document.querySelectorAll('button, [role="button"], a')).filter(function(el){
      if (el === hb || el.id === 'at-askai-fab' || el.id === 'at-demo-toggle') return false;

      hb = document.createElement('button');

        e.preventDefault();

      });

  function watchAskAi(){
    var msgs = document.getElementById('at-ai-msgs');
    var inp = document.getElementById('at-ai-input');
    var send = document.getElementById('at-ai-send');
    var chips = document.getElementById('at-ai-chips');

    if (send && inp && send.dataset.atQHook !== '1') {
      send.dataset.atQHook = '1';

        var v = (inp.value || '').trim();

    var bg = document.createElement('div');

    bg.innerHTML =
      '<div class="at-h-sheet">' +
        '<div class="at-h-head">' +
          '<div><div class="at-h-title">Saved Ask AI History</div><div class="at-h-sub">Search saved questions &amp; answers</div></div>' +
          '<div style="display:flex;gap:6px"><button type="button" class="at-h-btn" id="at-h-clear">Clear</button><button type="button" class="at-h-btn" id="at-h-close">Close</button></div>' +

    document.getElementById('at-h-search').addEventListener('input', function(){
      searchTerm = this.value || '';

  }

  function renderList(){
    var box = document.getElementById('at-h-list');
    if (!box) return;
    var all = load();
    var needle = searchTerm.trim().toLowerCase();
    var items = needle ? all.filter(function(x){ return (x.q + ' ' + x.a).toLowerCase().indexOf(needle) !== -1; }) : all;

    if (!items.length) {
      box.innerHTML = '<div class="at-h-card"><div class="at-h-q">' +
        (needle ? 'No saved Q&A matching "' + esc(needle) + '"' : 'No saved Ask AI history yet') +
        '</div><div class="at-h-a">Ask any question in Ask AI — both your question and the AI answer save here automatically.</div></div>';
      return;
    }

    box.innerHTML = items.map(function(it){

        '<div class="at-h-meta"><span>Auto-Saved • ' + esc(it.t) + '</span><button type="button" class="at-h-del" data-id="' + esc(it.id) + '">Delete</button></div>' +
        '<div class="at-h-q">Q: ' + esc(it.q) + '</div>' +
        '<div class="at-h-a">A: ' + esc(it.a) + '</div>' +

    renderList();

  }

(function(){

    "asifabad": "kumuram bheem asifabad",
    "kumuram bheem asifabad": "kumuram bheem asifabad",
    "mahabubabad": "mahabubabad",
    "mahbubabad": "mahabubabad",
    "mahabubnagar": "mahabubnagar",
    "mahbubnagar": "mahabubnagar",
    "mancherial": "mancherial",
    "medak": "medak",
    "medchal": "medchal malkajgiri",
    "malkajgiri": "medchal malkajgiri",
    "medchal malkajgiri": "medchal malkajgiri",
    "mulugu": "mulugu",
    "nagarkurnool": "nagarkurnool",
    "nalgonda": "nalgonda",
    "narayanpet": "narayanpet",
    "nirmal": "nirmal",

    "rangareddy": "rangareddy",
    "ranga reddy": "rangareddy",
    "sangareddy": "sangareddy",
    "siddipet": "siddipet",
    "suryapet": "suryapet",
    "vikarabad": "vikarabad",
    "wanaparthy": "wanaparthy",
    "yadadri": "yadadri bhuvanagiri",
    "bhuvanagiri": "yadadri bhuvanagiri",
    "bhongir": "yadadri bhuvanagiri",
    "yadadri bhuvanagiri": "yadadri bhuvanagiri"
  };

  function normKey(s){
    return String(s || "").toLowerCase().replace(/[^a-z0-9\s]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function getDistricts(){
    return (window.AQUATWIN_ML_DATA && Array.isArray(window.AQUATWIN_ML_DATA.districts))
      ? window.AQUATWIN_ML_DATA.districts
      : [];
  }

  function matchDistrict(text){
    var clean = normKey(text);
    if (!clean) return null;
    var list = getDistricts();
    if (!list.length) return null;

    var mapped = ALIASES[clean];
    if (mapped) {
      var exactMapped = list.find(function(d){ return normKey(d.district) === mapped; });
      if (exactMapped) return exactMapped;
    }

    // Check if any district name or alias appears as a full word/phrase inside the query
    var padded = " " + clean + " ";
    for (var i = 0; i < list.length; i++) {
      var dNorm = normKey(list[i].district);
      if (dNorm && padded.indexOf(" " + dNorm + " ") !== -1) {
        return list[i];
      }
    }

    var tokens = clean.split(" ").filter(function(t){ return t.length >= 3; });
    for (var tIdx = 0; tIdx < tokens.length; tIdx++) {
      var tok = tokens[tIdx];
      if (ALIASES[tok]) {
        var m2 = list.find(function(d){ return normKey(d.district) === ALIASES[tok]; });
        if (m2) return m2;
      }
      var prefixMatches = list.filter(function(d){
        var dn = normKey(d.district);
        return dn.indexOf(tok) === 0 || dn.split(" ").some(function(part){ return part.indexOf(tok) === 0; });
      });
      if (prefixMatches.length === 1) return prefixMatches[0];
    }
    return null;
  }

  function isStateQuery(text){
    var clean = normKey(text);
    return /\b(telangana|state|all 33|33 districts|overview|statewide)\b/.test(clean);
  }

  function buildStateSummary(){
    var list = getDistricts();
    if (!list.length) {
      return "Give state name (e.g., <b>Telangana</b>) or any of its 33 districts (e.g., <b>Hyderabad</b>, <b>Warangal</b>, <b>Khammam</b>, <b>Jangaon</b>) to get the answer.";
    }
    var sumWqi = list.reduce(function(a, b){ return a + Number(b.xgb_wqi || b.wqi_score || 70); }, 0);
    var avgWqi = (sumWqi / list.length).toFixed(1);
    var highRisk = list.filter(function(d){ return Number(d.xgb_wqi || d.wqi_score || 70) < 55; });
    var medRisk  = list.filter(function(d){ var w = Number(d.xgb_wqi || d.wqi_score || 70); return w >= 55 && w < 70; });
    var safeRisk = list.filter(function(d){ return Number(d.xgb_wqi || d.wqi_score || 70) >= 70; });
    var topAlert = highRisk.slice(0, 3).map(function(d){ return d.district + " (" + Number(d.xgb_wqi || d.wqi_score).toFixed(1) + ")"; }).join(", ") || "None critical";

    return (
      "<b>Telangana State Water Summary (33 Districts)</b><br>" +
      "• <b>State Avg WQI:</b> " + avgWqi + " / 100<br>" +
      "• <b>Status Split:</b> Safe: " + safeRisk.length + " • Moderate: " + medRisk.length + " • High Risk: " + highRisk.length + "<br>" +
      "• <b>Top Watch Districts:</b> " + topAlert + "<br>" +
      "• <i>Type any district name (e.g., Hyderabad, Warangal, Khammam, Jangaon) for full district telemetry.</i>"
    );
  }

  function findAskAiModal(){
    var headings = document.querySelectorAll("h1, h2, h3, h4, div, span");
    for (var i = 0; i < headings.length; i++) {
      var el = headings[i];
      if (el.children.length === 0 && /^AquaTwin Ask AI$/i.test((el.textContent || "").trim())) {
        var box = el.parentElement;
        while (box && box.parentElement && box.parentElement.tagName !== "BODY") {
          var rect = box.getBoundingClientRect();
          if (rect.height > 260 && rect.width > 240) return box;
          box = box.parentElement;
        }
        return el.parentElement;
      }
    }
    return null;
  }

  function appendAskAiPrompt(modal, userText, replyHtml){
    var input = modal.querySelector("input[type='text'], input:not([type]), textarea");
    var sendBtn = Array.from(modal.querySelectorAll("button")).find(function(b){
      return /^send$/i.test((b.textContent || "").trim());
    });

    // Find scrollable message container inside Ask AI modal
    var msgContainer = null;
    if (input) {
      var cur = input.parentElement;
      for (var d = 0; d < 6 && cur && cur !== modal; d++) {
        var prev = cur.previousElementSibling;
        if (prev && prev.scrollHeight >= prev.clientHeight) {
          msgContainer = prev;
          break;
        }
        cur = cur.parentElement;
      }
    }
    if (!msgContainer) {
      var divs = Array.from(modal.querySelectorAll("div"));
      divs.sort(function(a, b){ return b.clientHeight - a.clientHeight; });
      msgContainer = divs[0] || modal;
    }

    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;flex-direction:column;gap:8px;margin:8px 0;";

    var uBubble = document.createElement("div");
    uBubble.style.cssText = "align-self:flex-end;max-width:82%;padding:9px 13px;border-radius:14px;background:rgba(37,99,235,0.88);color:#fff;font-size:12.5px;font-weight:600;";
    uBubble.textContent = userText;

    var bBubble = document.createElement("div");
    bBubble.style.cssText = "align-self:flex-start;max-width:92%;padding:11px 14px;border-radius:14px;background:rgba(12,48,78,0.92);border:1px solid rgba(56,189,248,0.35);color:#e2e8f0;font-size:12px;line-height:1.45;";
    bBubble.innerHTML = replyHtml;

    wrap.appendChild(uBubble);
    wrap.appendChild(bBubble);
    msgContainer.appendChild(wrap);
    msgContainer.scrollTop = msgContainer.scrollHeight;

    if (input) {
      input.value = "";
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }
    if (sendBtn) sendBtn.blur();
  }

  function interceptAskAiSend(e){
    var modal = findAskAiModal();
    if (!modal || !modal.contains(e.target)) return;

    var input = modal.querySelector("input[type='text'], input:not([type]), textarea");
    var sendBtn = Array.from(modal.querySelectorAll("button")).find(function(b){
      return /^send$/i.test((b.textContent || "").trim());
    });

    var isSendClick = sendBtn && (e.target === sendBtn || sendBtn.contains(e.target));
    var isEnterKey = (e.type === "keydown" || e.type === "keypress") && e.key === "Enter" && input && (e.target === input || input.contains(e.target));
    if (!isSendClick && !isEnterKey) return;

    if (!input) return;
    var rawText = (input.value || "").trim();
    if (!rawText) {
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      appendAskAiPrompt(modal, "(Empty)", "Give state name (e.g., <b>Telangana</b>) or a Telangana district name (e.g., <b>Hyderabad</b>, <b>Warangal</b>, <b>Khammam</b>) to get the answer.");
      return;
    }

    // If user typed a valid district, let normal Ask AI district answer run
    if (matchDistrict(rawText)) return;

    // If user typed state name (Telangana / State), give Telangana state summary
    if (isStateQuery(rawText)) {
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      appendAskAiPrompt(modal, rawText, buildStateSummary());
      return;
    }

    // Otherwise user gave non-district/invalid text -> prompt to give state name first
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    appendAskAiPrompt(
      modal,
      rawText,
      "<b>Give state name</b> (type <b>Telangana</b>) or enter a valid district name (e.g., <b>Hyderabad</b>, <b>Warangal</b>, <b>Khammam</b>, <b>Jangaon</b>), then ask again to get the answer."
    );
  }

  document.addEventListener("click", interceptAskAiSend, true);
  document.addEventListener("keydown", interceptAskAiSend, true);
})();

    var ids = ["at-update-backdrop"];
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
    document.querySelectorAll("div, section").forEach(function(el){
      if (el.id === "at-auto-toast") return;
      var txt = (el.textContent || "");
      if (/New Update Available/i.test(txt) && /How to install/i.test(txt) && el.offsetHeight > 120) {
        if (el.parentNode) el.parentNode.removeChild(el);
      }
    });
  }

  function runAutoOpenSync(){
    purgeUpdateModal();
    var ver = String(window.AQUATWIN_VERSION || "").replace(/^v/i, "");
    var key = "aquatwin_last_applied_ver";
    var prev = localStorage.getItem(key);
    if (!ver || prev === ver) return;

    var toast = document.getElementById("at-auto-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "at-auto-toast";
      toast.innerHTML =
        '<div class="at-auto-row"><span id="at-auto-title">Updating AquaTwin AI...</span><span style="color:#34d399">v' + ver + '</span></div>' +
        '<div class="at-auto-sub" id="at-auto-sub">Applying latest version automatically</div>' +
        '<div class="at-auto-bar"><div class="at-auto-fill" id="at-auto-fill"></div></div>';
      document.body.appendChild(toast);
    }

    requestAnimationFrame(function(){
      toast.classList.add("show");
      var fill = document.getElementById("at-auto-fill");
      if (fill) setTimeout(function(){ fill.style.width = "100%"; }, 80);
    });

    setTimeout(function(){
      localStorage.setItem(key, ver);
      var tEl = document.getElementById("at-auto-title");
      var sEl = document.getElementById("at-auto-sub");
      if (tEl) tEl.textContent = "AquaTwin AI Updated";
      if (sEl) sEl.textContent = "Running v" + ver;
    }, 750);

    setTimeout(function(){
      toast.classList.remove("show");
    }, 2100);
  }

  var obs = new MutationObserver(purgeUpdateModal);
  obs.observe(document.documentElement || document.body, { childList: true, subtree: true });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(runAutoOpenSync, 400); });
  } else {
    setTimeout(runAutoOpenSync, 400);
  }
})();
</script>

<script id="at-mm3y-js">
(function(){
  if (window.__AT_MM3Y_INIT__) return;
  window.__AT_MM3Y_INIT__ = true;

  var activeHorizon = "6m"; // default highlight (+6M shows Rainfall + Reservoir coupling)

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function norm(s){
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }

  function getDistrictList(){
    return (window.AQUATWIN_ML_DATA && Array.isArray(window.AQUATWIN_ML_DATA.districts))
      ? window.AQUATWIN_ML_DATA.districts
      : [];
  }

  function detectSelectedDistrict(){
    var list = getDistrictList();
    if (!list.length) return null;

    var selects = document.querySelectorAll("select");
    for (var i = 0; i < selects.length; i++) {
      var val = selects[i].value || (selects[i].options[selects[i].selectedIndex] && selects[i].options[selects[i].selectedIndex].text) || "";
      var k = norm(val);
      if (k) {
        var hit = list.find(function(d){ return norm(d.district) === k; });
        if (hit) return hit;
      }
    }

    return list.find(function(d){ return norm(d.district) === "hyderabad"; }) || list[0];
  }

  function findAiTwinAnchor(){
    var nodes = document.querySelectorAll("h1, h2, h3, h4, div, span");
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.children.length !== 0) continue;
      var txt = (el.textContent || "").trim();
      if (/XGBoost \+ LSTM|Groundwater Aquifer|Digital Twin|What-If|Rainfall/i.test(txt)) {
        var box = el.parentElement;
        while (box && box.parentElement && box.parentElement.tagName !== "BODY") {
          var rect = box.getBoundingClientRect();
          if (rect.width > 220 && rect.height > 80) return box;
          box = box.parentElement;
        }
      }
    }
    return null;
  }

  function num(v, fallback){
    var n = Number(v);
    return isFinite(n) ? n : fallback;
  }

  function renderMultiModalCard(){
    var d = detectSelectedDistrict();
    if (!d) return;
    var anchor = findAiTwinAnchor();

      card = document.createElement("div");

      "1m": num(d.lstm_1m_wqi, wqiNow),
      "2m": num(d.lstm_2m_wqi, wqiNow),
      "6m": num(d.lstm_6m_wqi, wqiNow),
      "1y": num(d.lstm_1y_wqi, wqiNow)
    };
    var gwNow = num(d.gw_depth_mbgl, 8.2);
    var gwMap = {
      "1m": num(d.gw_pred_1m, gwNow),
      "2m": num(d.gw_pred_2m, gwNow),
      "6m": num(d.gw_pred_6m, gwNow),
      "1y": num(d.gw_pred_1y, gwNow)
    };
    var resNow = num(d.res_storage_pct, num(d.reservoir_idx, 45));
    var resMap = {
      "1m": num(d.res_pred_1m, resNow),

    var rainNow = num(d.rainfall_mm, 25);

      "2m": num(d.rain_pred_2m, rainNow),
      "6m": num(d.rain_pred_6m, rainNow),
      "1y": num(d.rain_pred_1y, rainNow)

    var wqiDelta = (wqiMap[hKey] - wqiNow).toFixed(1);

    var resDelta = (resMap[hKey] - resNow).toFixed(1);
    var stress   = num(d.hydro_stress_index, 42).toFixed(1);
    var sharePct = (window.AQUATWIN_ML_DATA && window.AQUATWIN_ML_DATA.rain_reservoir_6m_feature_share_pct) || 40;

    card.innerHTML =

      '</div>' +
      '<div class="at-mm-tabs">' +
        ['1m', '2m', '6m', '1y'].map(function(h){
          var lbl = h === '1y' ? '+1 Year' : ('+' + h.toUpperCase());
          return '<button type="button" class="at-mm-tab' + (h === hKey ? ' active' : '') + '" data-h="' + h + '">' + lbl + '</button>';
        }).join('') +
      '</div>' +
      '<div class="at-mm-grid">' +
        '<div class="at-mm-box">' +
          '<div class="at-mm-k">Surface Water WQI (' + hLabel + ')</div>' +
          '<div class="at-mm-v">' + wqiMap[hKey].toFixed(1) + ' / 100</div>' +
          '<div class="at-mm-d">Now: ' + wqiNow.toFixed(1) + ' (' + (Number(wqiDelta) >= 0 ? '+' : '') + wqiDelta + ')</div>' +
        '</div>' +
        '<div class="at-mm-box">' +
          '<div class="at-mm-k">Groundwater Depth (' + hLabel + ')</div>' +
          '<div class="at-mm-v">' + gwMap[hKey].toFixed(2) + ' mbgl</div>' +
          '<div class="at-mm-d">Now: ' + gwNow.toFixed(2) + 'm (' + (Number(gwDelta) >= 0 ? '+' : '') + gwDelta + 'm) • ' + esc(d.gw_status || 'Safe') + '</div>' +
        '</div>' +
        '<div class="at-mm-box">' +
          '<div class="at-mm-k">Reservoir Fill (' + hLabel + ')</div>' +
          '<div class="at-mm-v">' + resMap[hKey].toFixed(1) + '%</div>' +
          '<div class="at-mm-d">' + esc(d.reservoir_name || 'Basin Dam') + ' • Now: ' + resNow.toFixed(1) + '% (' + (Number(resDelta) >= 0 ? '+' : '') + resDelta + '%)</div>' +
        '</div>' +
        '<div class="at-mm-box">' +
          '<div class="at-mm-k">Rainfall Forecast (' + hLabel + ')</div>' +
          '<div class="at-mm-v">' + rainMap[hKey].toFixed(1) + ' mm</div>' +
          '<div class="at-mm-d">6M Cum: ' + num(d.rain_6m_cum_mm, 0).toFixed(0) + ' mm • SPI: ' + num(d.spi_6m_proxy, 0).toFixed(2) + '</div>' +
        '</div>' +
      '</div>' +
      '<table class="at-mm-table">' +
        '<thead><tr><th>Metric</th><th>Now</th><th>+1M</th><th>+2M</th><th>+6M</th><th>+1Y</th></tr></thead>' +
        '<tbody>' +
          '<tr><td>Water WQI</td><td>' + wqiNow.toFixed(1) + '</td><td>' + wqiMap['1m'].toFixed(1) + '</td><td>' + wqiMap['2m'].toFixed(1) + '</td><td>' + wqiMap['6m'].toFixed(1) + '</td><td>' + wqiMap['1y'].toFixed(1) + '</td></tr>' +
          '<tr><td>GW (mbgl)</td><td>' + gwNow.toFixed(2) + '</td><td>' + gwMap['1m'].toFixed(2) + '</td><td>' + gwMap['2m'].toFixed(2) + '</td><td>' + gwMap['6m'].toFixed(2) + '</td><td>' + gwMap['1y'].toFixed(2) + '</td></tr>' +
          '<tr><td>Reservoir %</td><td>' + resNow.toFixed(1) + '%</td><td>' + resMap['1m'].toFixed(1) + '%</td><td>' + resMap['2m'].toFixed(1) + '%</td><td>' + resMap['6m'].toFixed(1) + '%</td><td>' + resMap['1y'].toFixed(1) + '%</td></tr>' +
          '<tr><td>Rainfall mm</td><td>' + rainNow.toFixed(1) + '</td><td>' + rainMap['1m'].toFixed(1) + '</td><td>' + rainMap['2m'].toFixed(1) + '</td><td>' + rainMap['6m'].toFixed(1) + '</td><td>' + rainMap['1y'].toFixed(1) + '</td></tr>' +
        '</tbody>' +
      '</table>' +
      '<div class="at-mm-foot">' +
        '<span>Basin: ' + esc(d.river_basin || 'Telangana') + ' • Hydro Stress: ' + stress + '/100</span>' +
        '<span>Rain+Res +6M Driver: ' + esc(sharePct) + '%</span>' +
      '</div>';

    card.querySelectorAll(".at-mm-tab").forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        activeHorizon = btn.getAttribute("data-h") || "6m";
        renderMultiModalCard();
      };
    });
  }

  document.addEventListener("change", function(){ setTimeout(renderMultiModalCard, 120); }, true);
  document.addEventListener("click", function(e){
    if (e.target && e.target.closest && e.target.closest("#at-mm3y-card")) return;
    setTimeout(renderMultiModalCard, 250);
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(renderMultiModalCard, 600); });
  } else {
    setTimeout(renderMultiModalCard, 600);
  }
})();
</script>

<script id="at-runtime-lock">
(function(){
  if (window.__AT_RUNTIME_LOCKED__) return;
  window.__AT_RUNTIME_LOCKED__ = true;

  // Deep-freeze bundled 3-year ML/DL predictions in memory to block client-side tampering
  function deepFreeze(obj) {
    if (!obj || typeof obj !== "object" || Object.isFrozen(obj)) return obj;
    Object.freeze(obj);
    Object.keys(obj).forEach(function(k){ deepFreeze(obj[k]); });
    return obj;
  }

  function lockData(){
    if (window.AQUATWIN_ML_DATA && !Object.isFrozen(window.AQUATWIN_ML_DATA)) {
      deepFreeze(window.AQUATWIN_ML_DATA);
    }
  }

  // Enforce X-App-Client header automatically on any /forecast or /simulate fetch call
  var origFetch = window.fetch;
  if (typeof origFetch === "function" && !origFetch.__atWrapped) {
    window.fetch = function(input, init) {
      try {
        var urlStr = typeof input === "string" ? input : (input && input.url ? input.url : "");
        if (/\/(simulate|forecast)\b/i.test(urlStr)) {
          init = Object.assign({}, init || {});
          var hdrs = new Headers(init.headers || {});
          if (!hdrs.has("X-App-Client")) hdrs.set("X-App-Client", "aquatwin-v1");
          init.headers = hdrs;
        }
      } catch (e) {}
      return origFetch.call(this, input, init);
    };
    window.fetch.__atWrapped = true;
  }

  lockData();
  document.addEventListener("DOMContentLoaded", lockData);
})();
</script>

  if (window.__AT_ASK3Y_BOUND__) return;
  window.__AT_ASK3Y_BOUND__ = true;

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function norm(s){
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }

  function num(v, fb){
    var n = Number(v);
    return isFinite(n) ? n : fb;
  }

  function findDistrictFromText(txt){
    var list = (window.AQUATWIN_ML_DATA && Array.isArray(window.AQUATWIN_ML_DATA.districts))
      ? window.AQUATWIN_ML_DATA.districts : [];
    if (!list.length) return null;
    var firstLine = String(txt || "").split(/\r?\n/)[0] || "";
    var headPart = firstLine.split(/\u2014|--| - /)[0] || firstLine;
    var k = norm(headPart);
    var exact = list.find(function(d){ return norm(d.district) === k; });
    if (exact) return exact;
    var padded = " " + norm(firstLine) + " ";
    return list.find(function(d){ return padded.indexOf(" " + norm(d.district) + " ") !== -1; }) || null;
  }

  function enhanceAskAiCards(){
    var cards = document.querySelectorAll("div");
    for (var i = 0; i < cards.length; i++) {
      var el = cards[i];
      if (el.dataset.atAsk3yDone === "1") continue;
      if (el.querySelector && el.querySelector(".at-ask3y-box")) {
        el.dataset.atAsk3yDone = "1";
        continue;
      }
      var txt = (el.innerText || el.textContent || "");
      if (txt.indexOf("GROUNDWATER AQUIFER") === -1) continue;
      // Ensure we target the inner reply bubble, not an outer modal wrapper
      if (el.querySelectorAll("div").length > 8) continue;

      var d = findDistrictFromText(txt);
      if (!d) continue;
      el.dataset.atAsk3yDone = "1";

      var box = document.createElement("div");
      box.className = "at-ask3y-box";
      box.innerHTML =
        '<div class="at-ask3y-hdr">[4] RESERVOIR &amp; RAINFALL (3Y TRAINED)</div>' +
        '<div>&bull; Reservoir: <b>' + esc(d.reservoir_name || "Basin Dam") + '</b> (' + esc(d.river_basin || "Telangana") + ') &mdash; <b>' + num(d.res_storage_pct, 45).toFixed(1) + '%</b> (' + esc(d.res_status || "Moderate") + ')</div>' +
        '<div>&bull; Rainfall: <b>' + num(d.rainfall_mm, 20).toFixed(1) + ' mm</b> | 6M Cum: ' + num(d.rain_6m_cum_mm, 0).toFixed(0) + ' mm | SPI: ' + num(d.spi_6m_proxy, 0).toFixed(2) + ' (' + esc(d.rain_status || "Normal") + ')</div>' +
        '<hr class="at-ask3y-sep">' +
        '<div class="at-ask3y-hdr">[5] MULTI-MODAL FORECAST (+1M / +2M / +6M / +1 YEAR)</div>' +
        '<div>&bull; Water WQI: +1M <b>' + num(d.lstm_1m_wqi, 70).toFixed(1) + '</b> | +2M <b>' + num(d.lstm_2m_wqi, 70).toFixed(1) + '</b> | +6M <b>' + num(d.lstm_6m_wqi, 70).toFixed(1) + '</b> | +1Y <b>' + num(d.lstm_1y_wqi, 70).toFixed(1) + '</b></div>' +
        '<div>&bull; GW (mbgl): +1M <b>' + num(d.gw_pred_1m, 8).toFixed(2) + '</b> | +2M <b>' + num(d.gw_pred_2m, 8).toFixed(2) + '</b> | +6M <b>' + num(d.gw_pred_6m, 8).toFixed(2) + '</b> | +1Y <b>' + num(d.gw_pred_1y, 8).toFixed(2) + '</b></div>' +
        '<div>&bull; Reservoir: +1M <b>' + num(d.res_pred_1m, 45).toFixed(1) + '%</b> | +2M <b>' + num(d.res_pred_2m, 45).toFixed(1) + '%</b> | +6M <b>' + num(d.res_pred_6m, 45).toFixed(1) + '%</b> | +1Y <b>' + num(d.res_pred_1y, 45).toFixed(1) + '%</b></div>' +
        '<div>&bull; Rainfall : +1M <b>' + num(d.rain_pred_1m, 20).toFixed(1) + '</b> | +2M <b>' + num(d.rain_pred_2m, 20).toFixed(1) + '</b> | +6M <b>' + num(d.rain_pred_6m, 20).toFixed(1) + '</b> | +1Y <b>' + num(d.rain_pred_1y, 20).toFixed(1) + ' mm</b></div>';

      var gBtn = Array.from(el.querySelectorAll("a, button")).find(function(b){
        return /Search Google Live/i.test(b.textContent || "");
      });
      if (gBtn && gBtn.parentNode === el) {
        el.insertBefore(box, gBtn);
      } else {
        el.appendChild(box);
      }
    }
  }

  var obs = new MutationObserver(enhanceAskAiCards);
  obs.observe(document.documentElement || document.body, { childList: true, subtree: true });
  document.addEventListener("click", function(){ setTimeout(enhanceAskAiCards, 300); }, true);
})();
</script>
<!-- ASK_AI_3Y_EXT_END -->
